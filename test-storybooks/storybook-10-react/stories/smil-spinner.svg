<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80"><title>A rotating bar and a growing dot</title><rect x="56" y="8" width="8" height="64" fill="#16a34a"><animateTransform attributeName="transform" type="rotate" from="0 60 40" to="360 60 40" dur="1.5s" repeatCount="indefinite"/></rect><circle cx="100" cy="40" r="4" fill="#2563eb"><animate attributeName="r" values="4;16;4" dur="1s" repeatCount="indefinite"/></circle></svg>
