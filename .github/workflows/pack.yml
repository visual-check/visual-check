# Packs the packages a project installs, from one commit, with the browser image built from that commit: what the test
# apps run on (docs/prd/17-test-apps.md › A run). It uploads one artifact, visual-check-packages: each package's tarball
# as `pnpm pack` names it, and the amd64 browser image as chromium-image.tar.gz, which `docker load` reads.
#
# It always packs visual-check/visual-check: the commit `ref` names when the caller passes one, as the release workflow
# does with the commit release-please tagged. Else the commit under test when this repository calls it, else its
# default branch, as actions/checkout picks for another repository. The test apps install the packed browser package and
# load the image in the artifact. That's the image built here, or the one the caller names in `image-artifact`, as the
# Browser package workflow does with the candidate it pushed.
name: Pack

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to pack. Empty packs the commit actions/checkout picks.
        type: string
        default: ""
      image-artifact:
        description: >-
          An artifact of this run that holds the browser image as chromium-image.tar.gz, as the Browser package workflow
          saves the image it pushed. Empty builds the amd64 image from the packed commit.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: visual-check/visual-check
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: >-
          pnpm turbo run build --filter @visual-check/cli --filter @visual-check/storybook
          --filter @visual-check/storybook-addon
      - name: Pack the packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for package in cli storybook storybook-addon chromium; do
            (cd "packages/$package" && pnpm pack --pack-destination "$RUNNER_TEMP/packages")
          done
          ls -l "$RUNNER_TEMP/packages"
          # The release workflow's Publish to npm job prints the same lines for the files it publishes.
          (cd "$RUNNER_TEMP/packages" && sha256sum -- *.tgz)
      # The caller's image, as pushed, so it isn't built twice.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.image-artifact != ''
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/packages
      - name: Create a docker-container builder
        if: inputs.image-artifact == ''
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        if: inputs.image-artifact == ''
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:test-apps
      - name: Save the browser image
        if: inputs.image-artifact == ''
        run: docker save visual-check-chromium:test-apps | gzip > "$RUNNER_TEMP/packages/chromium-image.tar.gz"
      # Either way, the image the test apps load.
      - name: Show the browser image
        run: |
          ls -l "$RUNNER_TEMP/packages/chromium-image.tar.gz"
          sha256sum "$RUNNER_TEMP/packages/chromium-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-check-packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 3
          # The tarballs and the image are compressed already.
          compression-level: 0
