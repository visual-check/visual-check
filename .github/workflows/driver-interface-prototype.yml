# Throwaway prototype for the Driver interface prototype ticket. Lives only on this prototype branch.
# Builds a public Storybook (storybookjs/mealdrop at a pinned commit, plus the prototype's hazard stories) once, then
# each job captures it N times per arm (raw CDP Chromium, Playwright Chromium and Playwright WebKit, browser in the
# Playwright image) and runs the container cleanup and browser exit checks.
name: driver-interface-prototype

on:
  push:
    branches: [prototype/driver-interface]

permissions: {}

env:
  MEALDROP_SHA: 5ee1b204675b2d9eaf64fb33424384477946f369
  IMAGE: mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
  PASSES: "5"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the Storybook
        run: |
          git init -q mealdrop && cd mealdrop
          git fetch -q --depth 1 https://github.com/storybookjs/mealdrop.git "$MEALDROP_SHA" && git checkout -q FETCH_HEAD
          mkdir -p src/vc-hazards && cp ../prototype/driver-interface/stories/Hazards.stories.tsx src/vc-hazards/
          node .yarn/releases/yarn-4.18.0.cjs install --immutable
          node .yarn/releases/yarn-4.18.0.cjs build-storybook
          tar -C build -cf ../storybook.tar storybook && cd .. && sha256sum storybook.tar > storybook.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: |
            storybook.tar
            storybook.tar.sha256
          retention-days: 7

  capture:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: storybook
          path: sb
      - name: Unpack
        run: (cd sb && sha256sum -c storybook.tar.sha256) && tar -C sb -xf sb/storybook.tar
      - name: Install Playwright client (JS only)
        working-directory: prototype/driver-interface
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pull image by digest
        run: docker pull -q --platform linux/amd64 "$IMAGE" && docker tag "$IMAGE" mcr.microsoft.com/playwright:v1.64.1-noble
      - name: Capture
        run: prototype/driver-interface/ci.sh "$PWD/sb/storybook" "$PWD/out/job-${{ matrix.job }}" "$PASSES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-${{ matrix.job }}
          path: |
            out/job-${{ matrix.job }}/*.txt
            out/job-${{ matrix.job }}/*.log
            out/job-${{ matrix.job }}/*/summary.json
            out/job-${{ matrix.job }}/*/*/*/run.json
            out/job-${{ matrix.job }}/*/*/*.err
            out/job-${{ matrix.job }}/*/unstable/
            out/job-${{ matrix.job }}/checks/*.log
            out/job-${{ matrix.job }}/checks/*.err
            out/job-${{ matrix.job }}/checks/*/run.json
          retention-days: 7
