# Throwaway research for the Self-navigating stories under raw CDP ticket. Lives only on this research branch.
# Captures mealdrop's userflow stories (the Driver interface prototype's build, the same bytes, from its run) many times
# per arm on 2-vCPU runners: raw CDP, Playwright Chromium, and raw CDP plus each thing Playwright does differently.
name: self-navigating-stories

on:
  push:
    branches: [research/self-navigating-stories]

permissions: {}

env:
  STORYBOOK_RUN: "42204745376"
  STORYBOOK_SHA256: 3114c45921398afcb5b1b86980dae541dc5f022b41683508f812165d67cfd0f3
  IMAGE: mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
  PASSES: "1"
  H: research/self-navigating-stories

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: storybook
          path: sb
          run-id: ${{ env.STORYBOOK_RUN }}
          github-token: ${{ github.token }}
      - name: Unpack
        run: echo "$STORYBOOK_SHA256  sb/storybook.tar" | sha256sum -c && tar -C sb -xf sb/storybook.tar
      - name: Install Playwright client (JS only)
        working-directory: ${{ env.H }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pull image by digest
        run: docker pull -q --platform linux/amd64 "$IMAGE" && docker tag "$IMAGE" mcr.microsoft.com/playwright:v1.64.1-noble
      - name: Capture
        run: |
          OUT="$PWD/out/job-${{ matrix.job }}"; mkdir -p "$OUT"
          { nproc; lscpu | grep -E 'Model name'; free -m | head -2; docker version --format '{{.Server.Version}}'; } > "$OUT/machine.txt"
          node "$H/serve.mjs" "$PWD/sb/storybook" 6400 127.0.0.1 > "$OUT/serve.log" 2>&1 &
          until grep -q serving "$OUT/serve.log" 2>/dev/null; do sleep 0.1; done
          if [ "${{ matrix.job }}" = 1 ]; then
            mkdir -p "$OUT/protocol"
            node "$H/capture.ts" --driver pw --repeat 1 --out "$OUT/protocol/pw" --protocol-log "$OUT/protocol/pw-protocol.log" 2>"$OUT/protocol/pw.err" || true
          fi
          "$H/arms.sh" http://127.0.0.1:6400 "$OUT/runs" "$PASSES" "${{ matrix.job }}" 2>&1 | tee "$OUT/runs.log"
          python3 -I "$H/analyze.py" "$OUT/runs" | tee "$OUT/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-${{ matrix.job }}
          path: |
            out/job-${{ matrix.job }}/*.txt
            out/job-${{ matrix.job }}/*.log
            out/job-${{ matrix.job }}/runs/*/*/run.json
            out/job-${{ matrix.job }}/runs/*/*.err
            out/job-${{ matrix.job }}/protocol/
          retention-days: 7
