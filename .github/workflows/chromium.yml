name: Browser package

# Builds and verifies the browser image for amd64 and arm64 in one of three modes, which Plan picks:
# - build: a fork's pull request, whose token can't push or read GHCR. It only builds and verifies.
# - check: the version's tag is in GHCR. It also checks that the tag's index digest is the one the package records.
# - candidate: otherwise. It pushes both images by digest without a tag, records them as the candidate for this
#   package tree, and runs the test apps on the amd64 image as pushed. Merging publishes that candidate
#   (chromium-release.yml), so nothing is built again.
# The browser package bump workflow starts it on its branch, since a pull request a workflow opens starts no workflow.
# A run by hand on main makes a candidate there.
on:
  pull_request:
    paths:
      - packages/chromium/**
      - .github/workflows/chromium.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Picks the mode from the fork check and whether the version's tag is in GHCR. The tree of packages/chromium keys
  # the candidate: the release run finds it by the same tree on main.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      chromium: ${{ steps.plan.outputs.chromium }}
      tree: ${{ steps.plan.outputs.tree }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        # GHCR's registry answers 403 both for a package that doesn't exist yet and for one the caller can't read.
        # The REST API answers 404 when there is no package, so the plan asks it instead.
        # It may answer the same for a package this token can't read. Then the push fails, because writing
        # needs read access.
        run: |
          tag=$(jq -er .image.tag packages/chromium/chromium.json)
          image=${tag%:*}
          version=${tag##*:}
          chromium=$(jq -er .chromium packages/chromium/chromium.json)
          tree=$(git rev-parse HEAD:packages/chromium)
          {
            echo "image=$image"
            echo "version=$version"
            echo "chromium=$chromium"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"
          if [[ $FROM_FORK == true ]]; then
            echo "::notice::A pull request from a fork can't read the package, so this run only builds and verifies the image."
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          package=${image#ghcr.io/}
          exists=false
          if tags=$(gh api --paginate "/orgs/${package%%/*}/packages/container/${package#*/}/versions?per_page=100" \
            --jq '.[].metadata.container.tags[]?' 2> "$RUNNER_TEMP/gh-error"); then
            if grep -qxF "$version" <<< "$tags"; then
              exists=true
            fi
          elif ! grep -qF '(HTTP 404)' "$RUNNER_TEMP/gh-error"; then
            cat "$RUNNER_TEMP/gh-error" >&2
            exit 1
          fi
          if [[ $exists == true ]]; then
            echo "::notice::$tag is published, so this run checks its digest."
            echo "mode=check" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag isn't published, so this run pushes a candidate for it and runs the test apps on it."
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: plan
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a docker-container builder
        run: docker buildx create --driver docker-container --use
      - name: Build
        run: packages/chromium/image/build.sh "$ARCH" --output type=docker,name=visual-check-chromium:ci
      - name: Verify
        run: packages/chromium/image/verify-image.sh visual-check-chromium:ci "$ARCH"
      - name: Log in to GHCR
        if: needs.plan.outputs.mode == 'candidate'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The builder's cache holds every step of the verified build, so this pushes that same image, with gzip layers.
      # The check below proves it: the pushed image must have the verified image's layer diff IDs. No tag: merging
      # tags it.
      - name: Push by digest
        if: needs.plan.outputs.mode == 'candidate'
        run: |
          packages/chromium/image/build.sh "$ARCH" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true,compression=gzip,force-compression=true,oci-mediatypes=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json"
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          pushed=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image.RootFS.DiffIDs}}' | jq -c .)
          verified=$(docker image inspect --format '{{json .RootFS.Layers}}' visual-check-chromium:ci | jq -c .)
          if [[ $pushed != "$verified" ]]; then
            echo "::error::$IMAGE@$digest has other layers than the verified image."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$digest" > "$RUNNER_TEMP/digest/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.mode == 'candidate'
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3
      # The image as pushed, for the test apps. setup-app.sh reads the loaded image's name, so it gets a tag.
      - name: Save the pushed image for the test apps
        if: needs.plan.outputs.mode == 'candidate' && matrix.arch == 'amd64'
        run: |
          digest=$(cat "$RUNNER_TEMP/digest/$ARCH")
          docker pull --platform linux/amd64 "$IMAGE@$digest"
          docker tag "$IMAGE@$digest" visual-check-chromium:candidate
          mkdir -p "$RUNNER_TEMP/candidate-image"
          docker save visual-check-chromium:candidate | gzip > "$RUNNER_TEMP/candidate-image/chromium-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.mode == 'candidate' && matrix.arch == 'amd64'
        with:
          name: chromium-candidate-image
          path: ${{ runner.temp }}/candidate-image/chromium-image.tar.gz
          if-no-files-found: error
          retention-days: 3
          # The image is compressed already.
          compression-level: 0

  # Records both pushed digests as the candidate for this package tree. The release run on main finds it by the same
  # tree, so it lives as long as an artifact can: a bump PR may wait.
  candidate:
    name: Candidate
    needs: [plan, image]
    if: needs.plan.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHROMIUM: ${{ needs.plan.outputs.chromium }}
      TREE: ${{ needs.plan.outputs.tree }}
      # A pull request's run is on a merge commit nobody can fetch later, so the candidate names the head commit, as
      # the run's head_sha does.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Write the candidate
        run: |
          digests='{}'
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$arch")
            if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The $arch digest artifact holds '$digest', not a sha256 digest."
              exit 1
            fi
            digests=$(jq -c --arg arch "$arch" --arg digest "$digest" '. + {($arch): $digest}' <<< "$digests")
          done
          mkdir -p "$RUNNER_TEMP/candidate"
          jq -n --arg version "$VERSION" --arg chromium "$CHROMIUM" --arg tree "$TREE" --arg commit "$COMMIT" \
            --argjson run_attempt "$RUN_ATTEMPT" --argjson digests "$digests" \
            '{version: $version, chromium: $chromium, tree: $tree, commit: $commit, run_attempt: $run_attempt, digests: $digests}' \
            > "$RUNNER_TEMP/candidate/candidate.json"
          cat "$RUNNER_TEMP/candidate/candidate.json"
          {
            echo "### Browser image candidate"
            echo
            echo "- Version: $VERSION"
            echo "- Chromium: $CHROMIUM"
            echo "- Tree: \`$TREE\`"
            jq -r 'to_entries[] | "- \(.key): `\(.value)`"' <<< "$digests"
            echo
            echo "Merging publishes these images when this run passes."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-candidate-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/candidate/candidate.json
          if-no-files-found: error
          retention-days: 90

  # This commit's packages with the amd64 image as pushed, so the test apps run on what merging publishes.
  pack:
    name: Pack
    needs: [plan, candidate]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'candidate' && needs.candidate.result == 'success' }}
    uses: ./.github/workflows/pack.yml
    with:
      image-artifact: chromium-candidate-image

  # The test apps on the candidate, from a test-apps branch named like this one when there is one. This run's success
  # is what makes the candidate publishable: the release run takes only a successful run's candidate.
  test-apps:
    name: Test apps
    needs: pack
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    uses: visual-check/test-apps/.github/workflows/test-apps.yml@main
    with:
      artifact: visual-check-packages

  # Checks that the published tag's index digest is the one the package records. Fork pull requests skip it: their
  # token can't read a private package.
  check:
    name: Check
    needs: [plan, image]
    if: needs.plan.outputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Check the index
        run: packages/chromium/image/check-index.sh "$IMAGE:$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
