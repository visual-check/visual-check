name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    name: Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm turbo run test:type
      - name: Fallow
        run: pnpm lint:fallow
      # The agent skill against the Agent Skills format. skills-ref wants the skill in a folder named after it.
      - name: Agent skill format
        run: |
          mkdir -p "$RUNNER_TEMP/visual-check"
          cp packages/cli/skill/SKILL.md "$RUNNER_TEMP/visual-check/SKILL.md"
          pipx run --spec skills-ref==0.1.1 agentskills validate "$RUNNER_TEMP/visual-check"
      - name: Unit tests
        run: pnpm turbo run test:unit

  node-22:
    name: Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm turbo run test:unit
      - name: Create a docker-container builder
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:ci
      - name: End-to-end check
        env:
          TEST_STORYBOOK_IMAGE: visual-check-chromium:ci
        run: pnpm turbo run e2e --filter @visual-check/test-storybook-10-react
      - name: Upload the end-to-end output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ github.job }}
          path: test-storybooks/storybook-10-react/e2e-output/
          if-no-files-found: ignore
          retention-days: 3

  own-storybooks:
    name: Own Storybooks (${{ matrix.storybook }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        storybook: [storybook-9-react, storybook-10-react, storybook-11-react]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create a docker-container builder
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:ci
      - name: End-to-end check
        env:
          TEST_STORYBOOK_IMAGE: visual-check-chromium:ci
        run: pnpm turbo run e2e --filter @visual-check/test-${{ matrix.storybook }}
      - name: Upload the end-to-end output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ github.job }}-${{ matrix.storybook }}
          path: test-storybooks/${{ matrix.storybook }}/e2e-output/
          if-no-files-found: ignore
          retention-days: 3

  # init under each package manager, with the packages packed and served from a local registry. On a tiny Storybook:
  # `init --yes`, install, one `update` without `CI` and one `test`, then a second `init` that changes nothing. On a
  # monorepo with two Storybooks on one port: `init --yes` writes one root config and warns, then install; no Storybook
  # starts, so it needs no browser image. Yarn runs through the Corepack Node ships.
  setup:
    name: Setup (${{ matrix.package-manager }}, ${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package-manager: [pnpm, npm, yarn1, yarn4]
        fixture: [single, monorepo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Corepack runs
        if: startsWith(matrix.package-manager, 'yarn')
        run: corepack --version
      - name: Create a docker-container builder
        if: matrix.fixture == 'single'
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        if: matrix.fixture == 'single'
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:ci
      - name: Setup check
        env:
          TEST_STORYBOOK_IMAGE: visual-check-chromium:ci
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          FIXTURE: ${{ matrix.fixture }}
        run: >-
          pnpm turbo run init-check --filter @visual-check/test-setup --
          --package-manager "$PACKAGE_MANAGER" --fixture "$FIXTURE"
      - name: Upload the Setup check's output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: init-check-output-${{ github.job }}-${{ matrix.package-manager }}-${{ matrix.fixture }}
          path: test-storybooks/setup/init-check-output/
          if-no-files-found: ignore
          retention-days: 3

  # The committed baselines are written on amd64. This runs them on the arm64 image, where the default tolerance
  # absorbs the differences. On failure, the end-to-end output holds `test`'s report with the images that differ.
  arm64-image:
    name: arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create a docker-container builder
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        run: packages/chromium/image/build.sh arm64 --output type=docker,name=visual-check-chromium:ci
      - name: End-to-end check on linux/arm64
        env:
          TEST_STORYBOOK_IMAGE: visual-check-chromium:ci
        run: pnpm turbo run e2e --filter @visual-check/test-storybook-10-react -- --arm64
      - name: Upload the end-to-end output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ github.job }}
          path: test-storybooks/storybook-10-react/e2e-output/
          if-no-files-found: ignore
          retention-days: 3

  # Apple Silicon runners have no Docker, so the skill script's cases run on the host.
  macos-no-docker:
    name: macOS without Docker
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check there's no Docker
        run: "! command -v docker"
      # The baseline files' unit tests, on APFS.
      - name: Baseline files
        run: pnpm turbo run test:unit --filter @visual-check/cli -- src/baselines
      # The skill script's own tests: they start and stop fake Storybooks and the CLI, and interrupt them.
      - name: Skill script
        run: pnpm turbo run test:unit --filter @visual-check/cli -- test/skill-run
      # The host check downloads the headless shell into a cache this job names, which must start empty, and the
      # affected stories check reuses it.
      - name: No-Docker error and one host capture
        env:
          VISUAL_CHECK_CACHE_DIR: ${{ runner.temp }}/visual-check-cache
        run: pnpm turbo run e2e --filter @visual-check/test-storybook-10-react -- --host --no-docker
      # The check runs the CLI without `CI`, so `test` with no selection flag covers the affected stories. The checkout
      # holds one commit, so each run measures the changed files from `--base HEAD`.
      - name: Affected stories
        env:
          VISUAL_CHECK_CACHE_DIR: ${{ runner.temp }}/visual-check-cache
        run: pnpm turbo run e2e --filter @visual-check/test-storybook-10-react -- --host --affected
      # pnpm skips the `visual-check` command when the CLI's `dist/bin.js` doesn't exist yet, as at the first install,
      # and the skill's `pnpm exec visual-check` needs it. The steps above built the CLI.
      - name: Link the CLI's command
        run: pnpm install --frozen-lockfile --offline
      # The skill script's end to end cases on the host: it starts and stops Storybook, reuses one already running,
      # stops at a port mismatch, starts only the Storybook a change reaches, and an interrupt stops what it started.
      - name: Skill script end to end
        env:
          VISUAL_CHECK_CACHE_DIR: ${{ runner.temp }}/visual-check-cache
        run: pnpm turbo run e2e --filter @visual-check/test-storybook-10-react -- --host --skill-script
      - name: init without Docker
        run: pnpm turbo run init-check --filter @visual-check/test-setup -- --package-manager pnpm --init-only

  # The runner image's Docker runs Windows containers only, so the job stops it and installs Docker Desktop with its
  # WSL 2 backend, about 6 minutes in all. It runs the skill script's and the agent skill's own tests, builds the
  # browser image, then the end-to-end check's skill script cases: they start and stop the test Storybooks through
  # `cmd.exe` and `taskkill`, and check that an interrupt mid-capture and a killed CLI leave no browser container.
  windows-skill-script:
    name: Windows skill script
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Windows runners set core.autocrlf, which would check out build.sh and the image's scripts with CRLF.
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest directly, not through turbo, whose strict environment mode may drop Windows variables the tests read. The
      # agent skill's tests copy the skill to `.claude` on NTFS.
      - name: Skill script and agent skill tests
        run: pnpm --filter @visual-check/cli exec vitest run test/skill-run src/agent-skill
      # Docker Desktop 4.98.0, the version research #33 ran on this runner. To bump it, take the build number from
      # Docker Desktop's release notes, and the checksum from checksums.txt beside the installer.
      - name: Install Docker Desktop
        shell: pwsh
        run: |
          $build = '245422'
          $checksum = 'cd6273d9eaa4f07fa7593fc6813d37e1004381cebc3f26047a2554fa5db24388'
          $installer = "$env:RUNNER_TEMP\DockerDesktopInstaller.exe"
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://desktop.docker.com/win/main/amd64/$build/Docker%20Desktop%20Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 10
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $checksum) { throw "The Docker Desktop installer's checksum is $hash, not $checksum." }
          $arguments = 'install', '--quiet', '--accept-license', '--backend=wsl-2', '--always-run-service'
          $process = Start-Process $installer -ArgumentList $arguments -PassThru
          # Reading the handle keeps it open, so ExitCode isn't null once the installer exits.
          $null = $process.Handle
          if (-not $process.WaitForExit(300000)) { throw 'The Docker Desktop installer ran over 5 minutes.' }
          "Installer exit code: $($process.ExitCode)"
          if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) {
            throw "The Docker Desktop installer exited with code '$($process.ExitCode)'."
          }
          # The runner's own Docker service holds \\.\pipe\docker_engine, which Docker Desktop needs.
          Stop-Service docker -Force
          Start-Process 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
          $docker = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            & $docker --context desktop-linux info *> $null
            if (-not $LASTEXITCODE) { break }
            Start-Sleep 5
          }
          if ($LASTEXITCODE) {
            # What the engine, the services, WSL and Docker Desktop's logs say, for the log.
            try {
              & $docker --context desktop-linux info
              Get-Service com.docker.service, docker -ErrorAction SilentlyContinue | Format-Table | Out-String
              (wsl.exe -l -v | Out-String) -replace "`0", ''
              $logs = Get-ChildItem "$env:LOCALAPPDATA\Docker\log" -Recurse -File -ErrorAction SilentlyContinue
              foreach ($log in $logs) {
                "--- $($log.FullName)"
                Get-Content $log.FullName -Tail 50 -ErrorAction SilentlyContinue
              }
            } catch {
              "Couldn't gather the diagnostics: $_"
            }
            throw "Docker Desktop's engine didn't answer within 5 minutes."
          }
          & $docker --context desktop-linux info --format '{{.OSType}}'
          & $docker context use desktop-linux
          if ($LASTEXITCODE) { throw "Couldn't switch docker to the desktop-linux context." }
          'C:\Program Files\Docker\Docker\resources\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Check Docker runs Linux containers
        shell: bash
        run: |
          os=$(docker info --format '{{.OSType}}')
          echo "OSType: $os"
          test "$os" = linux
          docker buildx version
      - name: Create a docker-container builder
        shell: bash
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        shell: bash
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:ci
      - name: Build the CLI and the Storybook
        run: pnpm turbo run build build-storybook --filter '@visual-check/test-storybook-10-react...'
      # On Windows pnpm skips the `visual-check` command when the CLI's `dist/bin.js` doesn't exist yet, as at the first
      # install, and the skill's `pnpm exec visual-check` needs it.
      - name: Link the CLI's command
        run: pnpm install --frozen-lockfile --offline
      # Not through turbo, whose strict environment mode may drop Windows variables that docker and pnpm read, such as
      # USERPROFILE.
      - name: Skill script end to end
        working-directory: test-storybooks/storybook-10-react
        env:
          TEST_STORYBOOK_IMAGE: visual-check-chromium:ci
        run: node e2e.ts --skill-script
      - name: Upload the end-to-end output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ github.job }}
          path: test-storybooks/storybook-10-react/e2e-output/
          if-no-files-found: ignore
          retention-days: 3

  # One host capture where Chromium's sandbox can't start, so visual-check relaunches the browser without it. The
  # check downloads the headless shell into a cache this job names, so a later step can run it.
  ubuntu-host:
    name: Ubuntu host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 23.10 and later block the unprivileged user namespaces the sandbox needs for a browser with no AppArmor
      # profile. The runner image may relax that, so the job sets it.
      - name: Keep Chromium's sandbox from starting
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - name: End-to-end check on the host
        env:
          VISUAL_CHECK_CACHE_DIR: ${{ runner.temp }}/visual-check-cache
        run: pnpm turbo run e2e --filter @visual-check/test-storybook-10-react -- --host
      # The check passed. The headless shell it downloaded starts without its sandbox but not with it, so the check's
      # captures came from the relaunch without the sandbox. Each run prints what the shell said, for the log.
      - name: Check the sandbox can't start
        env:
          VISUAL_CHECK_CACHE_DIR: ${{ runner.temp }}/visual-check-cache
        run: |
          version=$(jq -r .chromium packages/chromium/chromium.json)
          shell="$VISUAL_CHECK_CACHE_DIR/chromium/$version/chrome-headless-shell-linux64/chrome-headless-shell"
          timeout 60 "$shell" --no-sandbox --headless --dump-dom about:blank
          if timeout 60 "$shell" --headless --dump-dom about:blank; then
            echo "The headless shell started with its sandbox, so the check didn't need the relaunch."
            exit 1
          fi

  inside-image:
    name: Inside the image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI and the Storybook
        run: pnpm turbo run build build-storybook --filter '@visual-check/test-storybook-10-react...'
      - name: Create a docker-container builder
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:ci
      # visual-check's image isn't in a registry yet, so this stands in for a job container on it with Node added: it
      # mounts the workspace and the runner's Node into the image. Unlike a job container it has no network, which
      # shows the run downloads nothing, and the image has no docker.
      - name: End-to-end check inside the image
        run: |
          node_dir=$(dirname "$(dirname "$(node -p process.execPath)")")
          docker run --rm --network none --env CI \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE/test-storybooks/storybook-10-react" \
            --volume "$node_dir:/opt/node:ro" \
            --env PATH=/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            visual-check-chromium:ci node e2e.ts --inside-image
      - name: Upload the end-to-end output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ github.job }}
          path: test-storybooks/storybook-10-react/e2e-output/
          if-no-files-found: ignore
          retention-days: 3

  # A job container on another image than visual-check's, with the docker CLI added. Actions mounts the Docker socket
  # into it, so the CLI finds its own container and the browser joins its network to reach the Storybook the
  # end-to-end check serves on the container's loopback.
  job-container:
    name: Job container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docker's own apt repository for Debian, the image's base: the CLI and buildx only, no daemon. build.sh reads the
      # browser package with jq, which the image lacks too.
      - name: Install the docker CLI and jq
        run: |
          repository=https://download.docker.com/linux/debian
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL --retry 5 "$repository/gpg" -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] $repository bookworm stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install --yes --no-install-recommends docker-ce-cli docker-buildx-plugin jq
      - name: Check Docker
        run: docker version && docker buildx version
      - name: Create a docker-container builder
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:ci
      - name: End-to-end check
        env:
          TEST_STORYBOOK_IMAGE: visual-check-chromium:ci
        run: pnpm turbo run e2e --filter @visual-check/test-storybook-10-react
      - name: Upload the end-to-end output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ github.job }}
          path: test-storybooks/storybook-10-react/e2e-output/
          if-no-files-found: ignore
          retention-days: 3

  # A devcontainer that uses the host's Docker through the docker-outside-of-docker feature. The CLI finds the
  # devcontainer through Docker, and the browser joins its network. The browser image is built on the host.
  devcontainer:
    name: Devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only for the devcontainer CLI: pnpm runs inside the devcontainer, so there is no pnpm cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Create a docker-container builder
        run: docker buildx create --driver docker-container --use
      - name: Build the browser image
        run: packages/chromium/image/build.sh amd64 --output type=docker,name=visual-check-chromium:ci
      - name: Start the devcontainer
        run: npx --yes @devcontainers/cli@0.90.0 up --workspace-folder . --config .github/devcontainer/devcontainer.json
      - name: End-to-end check in the devcontainer
        run: >-
          npx --yes @devcontainers/cli@0.90.0 exec --workspace-folder . --config .github/devcontainer/devcontainer.json
          --remote-env CI=true --remote-env TEST_STORYBOOK_IMAGE=visual-check-chromium:ci
          bash -c 'pnpm install --frozen-lockfile && pnpm turbo run e2e --filter @visual-check/test-storybook-10-react'
      - name: Upload the end-to-end output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ github.job }}
          path: test-storybooks/storybook-10-react/e2e-output/
          if-no-files-found: ignore
          retention-days: 3

  lockstep:
    name: Lockstep versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node packages/repo-checks/src/check-lockstep.ts
