name: Browser checksums

on:
  pull_request:
    paths:
      - packages/chromium/chromium.json
      - packages/repo-checks/src/chromium-checksums/**
      - packages/repo-checks/src/check-chromium-checksums.ts
      - packages/repo-checks/src/workspace/manifests.ts
      - .github/workflows/chromium-checksums.yml
  push:
    branches: [main]
    paths:
      - packages/chromium/chromium.json
      - packages/repo-checks/src/chromium-checksums/**
      - packages/repo-checks/src/check-chromium-checksums.ts
      - packages/repo-checks/src/workspace/manifests.ts
      - .github/workflows/chromium-checksums.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checksums:
    name: Checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node packages/repo-checks/src/check-chromium-checksums.ts
