<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>visual-check docs · Notebook</title>
<!-- PROTOTYPE — throwaway. Docs variant 2: "Notebook" (the Product hub direction, research/fumadocs.md §4 B).
     Fumadocs `layouts/notebook` with nav.mode 'top' and tabMode 'navbar': the landing page's SiteHeader runs across the top,
     the root folders (Guides, Run, Integrations, Reference) are tabs under it, and the sidebar below shows the current tab.
     The docs home (#home) is a `full` page: a task hub. Every page lives in this file, routed by location.hash. -->
<link rel="icon" href="../shared/logo/favicon.svg">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/bundle.css">
<link rel="stylesheet" href="../shared/proto-base.css">
<style>
  /* Values the design system doesn't have yet (become tokens before the real build):
     - header: SiteHeader row 64px (DS), root-folder tabs row 44px under it (Fumadocs Notebook navbar tabs); 2px tab underline
     - sidebar width 268px, TOC width 240px (Fumadocs: 268 / 268)
     - article max width: 720px by default (keeps body copy near the DS 64–72 character measure), 960px wide,
       1168px for a `full` page (Fumadocs DocsLayout `full`)
     - sidebar row: 6px block padding (32px rows); TOC row: 5px block padding
     - "On this page" bar under the header below 1280px: 44px
     - search dialog: 640px wide, 12vh from the top, 56px input row; drawer 85vw up to 380px
     - step marker 28px; icon chips 32px and 40px; pixel cells in the worked example: 2px radius, 4px gap
     - overlay behind dialogs: ink at 48% (no `overlay` token yet)
     - phone gutter 16px, to line up with the SiteHeader's own 16px (the DS names space-6 as the phone gutter)
     - SiteHeader steps between 768 and 1199px (the DS header overflows there): see the container queries below
     - h2 in docs: 48px above (space-12). The DS says space-8, which reads cramped under a 30px heading
     - z-index: header 40, "On this page" bar 30
     - the worked example's pixel greys are image content (literal rgb), not UI colours */

  :root {
    --nb-row-h: 64px;
    --nb-tabs-h: 44px;
    --nb-header-h: 109px; /* measured by the script */
    --nb-tocbar-h: 0px;   /* measured by the script */
    --nb-sidebar-w: 268px;
    --nb-toc-w: 240px;
    --nb-article-max: 720px;
    --nb-article-full: 1168px;
    --nb-gutter: var(--space-8);
    --nb-overlay: color-mix(in srgb, var(--brand-ink) 48%, transparent);
  }
  html[data-t-width="wide"] { --nb-article-max: 960px; }
  @media (max-width: 1279px) { :root { --nb-gutter: var(--space-6); } }
  @media (max-width: 767px) { :root { --nb-gutter: var(--space-4); } }

  body { min-height: 100dvh; }
  .nb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nb-skip { position: absolute; left: var(--space-4); top: -100px; z-index: 60; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); background: var(--action-primary); color: var(--on-action-primary); font: var(--text-ui); }
  .nb-skip:focus { top: var(--space-2); }

  /* ---------- header: Fumadocs Notebook header (nav.mode 'top') ---------- */
  .nb-header { position: sticky; top: 0; z-index: 40; }
  .nb-header .vc-header__nav a { white-space: nowrap; }
  .nb-brand { display: flex; align-items: center; gap: var(--space-1); flex: none; }
  .nb-brand__slash { color: var(--border-strong); font: 300 24px/1 var(--font-display); margin-inline: var(--space-1); }
  .nb-brand__docs {
    padding: 6px var(--space-2);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font: 600 16px/20px var(--font-display);
    letter-spacing: -0.005em;
    text-decoration: none;
    transition: background-color var(--duration-fade) var(--ease-out);
  }
  .nb-brand__docs:hover { background: var(--bg-surface); }

  /* The shared header is wider than a tablet: between 768 and 1199px of its own width it sheds, in order, the
     logo-area "Docs" label and the search field's label, then GitHub and Get started (GitHub stays in the sidebar
     footer, Getting started in the sidebar). */
  @container (max-width: 1199px) {
    .nb-brand__slash, .nb-brand__docs { display: none; }
    .nb-header .vc-search { display: none; }
    .nb-header .vc-header__search-icon { display: inline-grid; }
  }
  @container (max-width: 959px) {
    .nb-header .vc-header__inner { padding: 0 var(--space-6); }
    .nb-header .vc-header__wide { display: none; }
    .nb-tabs { padding: 0 calc(var(--space-6) - 10px); }
  }
  @container (max-width: 767px) {
    .nb-header .vc-header__inner { padding: 0 var(--space-4); }
    .nb-brand__slash, .nb-brand__docs { display: revert; }
  }

  /* Root-folder tabs (tabMode 'navbar') */
  .nb-tabs {
    display: flex;
    align-items: stretch;
    gap: var(--space-1);
    height: var(--nb-tabs-h);
    padding: 0 calc(var(--space-8) - 10px);
    border-top: 1px solid var(--border-subtle);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nb-tabs::-webkit-scrollbar { display: none; }
  html[data-t-tabs="sidebar"] .nb-tabs { display: none; }
  .nb-tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 0 10px;
    color: var(--text-muted);
    font: var(--text-ui);
    font-size: 14px;
    text-decoration: none;
    white-space: nowrap;
    transition: color var(--duration-fade) var(--ease-out);
  }
  .nb-tab::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 0;
    height: 2px;
    border-radius: 1px;
    background: var(--text-muted);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform var(--duration-spring) var(--ease-spring);
  }
  .nb-tab:hover { color: var(--text-primary); }
  .nb-tab:hover::after { transform: scaleX(1); }
  .nb-tab[aria-current="page"] { color: var(--text-primary); }
  .nb-tab[aria-current="page"]::after { transform: scaleX(1); background: var(--text-cyan); }
  .nb-tab:focus-visible { outline-offset: -2px; }
  .nb-tab__count { font: var(--text-label); color: var(--text-muted); }

  /* ---------- layout: sidebar | (TOC bar, article, TOC) ---------- */
  .nb-layout { display: grid; grid-template-columns: var(--nb-sidebar-w) minmax(0, 1fr); }
  .nb-body { min-width: 0; }
  .nb-columns { display: flex; justify-content: center; align-items: flex-start; }
  .nb-main { flex: 0 1 var(--nb-article-max); min-width: 0; }
  .nb-main:focus { outline: none; }
  html.nb-is-full .nb-main { flex-basis: var(--nb-article-full); }

  /* ---------- sidebar: aside#nd-sidebar ---------- */
  .nb-sidebar {
    position: sticky;
    top: var(--nb-header-h);
    height: calc(100dvh - var(--nb-header-h));
    display: flex;
    flex-direction: column;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-subtle);
  }
  .nb-sidebar__head { padding: var(--space-4) var(--space-4) 0 var(--space-6); }
  .nb-sidebar__head:empty { display: none; }
  html[data-t-tabs="navbar"] .nb-sidebar .nb-sidebar__head { display: none; }
  .nb-sidebar__scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-6) var(--space-4) var(--space-6) var(--space-6); }
  .nb-sidebar__foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-4) var(--space-3) var(--space-6);
    border-top: 1px solid var(--border-subtle);
    font: var(--text-label);
    color: var(--text-muted);
  }
  .nb-sidebar__foot a { color: var(--text-muted); text-decoration: none; }
  .nb-sidebar__links { display: flex; gap: var(--space-3); }
  .nb-sidebar__foot a:hover { color: var(--text-primary); text-decoration: underline; text-underline-offset: 3px; }

  .nb-side-group + .nb-side-group { margin-top: var(--space-6); }
  .nb-side-sep { margin: 0 0 var(--space-2); padding: 0 var(--space-2); font: var(--text-label); letter-spacing: .02em; color: var(--text-muted); }
  .nb-side-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .nb-side-link {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: 6px var(--space-2);
    border-radius: var(--radius-md);
    color: var(--text-muted);
    font: var(--text-small);
    text-decoration: none;
    transition: background-color var(--duration-fade) var(--ease-out), color var(--duration-fade) var(--ease-out);
  }
  .nb-side-link:hover { background: var(--bg-page); color: var(--text-primary); }
  .nb-side-link[aria-current="page"] { background: var(--bg-raised); color: var(--text-cyan); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .nb-side-link:focus-visible, .nb-folder__btn:focus-visible { outline-offset: -2px; }
  .nb-side-link code, .nb-folder code, .nb-tab code { font: 400 13px/20px var(--font-mono); }
  .nb-side-link .vc-icon { color: var(--text-muted); }

  /* Root folders as folders: the sidebar of a page outside every root folder (the docs home) */
  .nb-folder + .nb-folder { margin-top: 2px; }
  .nb-folder__btn {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    padding: 6px var(--space-2);
    border: 0;
    border-radius: var(--radius-md);
    background: none;
    color: var(--text-primary);
    font: var(--text-small);
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background-color var(--duration-fade) var(--ease-out);
  }
  .nb-folder__btn:hover { background: var(--bg-page); }
  .nb-folder__chev { margin-left: auto; color: var(--text-muted); transition: transform var(--duration-spring) var(--ease-spring); }
  .nb-folder__btn[aria-expanded="true"] .nb-folder__chev { transform: rotate(90deg); }
  .nb-folder__body { margin: var(--space-1) 0 var(--space-3) 15px; padding-left: var(--space-2); border-left: 1px solid var(--border-subtle); }
  .nb-folder__body .nb-side-group + .nb-side-group { margin-top: var(--space-3); }
  .nb-folder__body .nb-side-sep { margin-top: var(--space-2); }

  /* Root-folder switcher (tabMode off): SidebarTabsDropdown */
  .nb-root {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    padding: var(--space-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--bg-raised);
    color: var(--text-primary);
    text-align: left;
    cursor: pointer;
    transition: border-color var(--duration-fade) var(--ease-out);
  }
  .nb-root:hover { border-color: var(--border-strong); }
  .nb-root__icon, .nb-chip-icon {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex: none;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    color: var(--text-primary);
  }
  .nb-root__text { display: grid; min-width: 0; flex: 1; }
  .nb-root__title { font: var(--text-ui); font-size: 14px; }
  .nb-root__desc { font: var(--text-small); font-size: 13px; line-height: 18px; color: var(--text-muted); }
  .nb-root > .vc-icon { color: var(--text-muted); }

  /* ---------- popover menus (Open ▾, root switcher) ---------- */
  .nb-menu {
    position: fixed;
    inset: auto;
    margin: 0;
    min-width: 232px;
    max-width: calc(100vw - 16px);
    padding: var(--space-1);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    background: var(--bg-raised);
    color: var(--text-primary);
    box-shadow: var(--shadow-raised);
  }
  .nb-menu__item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font: var(--text-small);
    text-decoration: none;
    transition: background-color var(--duration-fade) var(--ease-out);
  }
  .nb-menu__item:hover, .nb-menu__item:focus-visible { background: var(--bg-surface); }
  .nb-menu__item:focus-visible { outline-offset: -2px; }
  .nb-menu__item > .vc-icon:first-child { color: var(--text-muted); }
  .nb-menu__end { margin-left: auto; color: var(--text-muted); }
  .nb-menu--roots { width: 300px; }
  .nb-menu--roots .nb-menu__item { gap: var(--space-3); padding: var(--space-2); }
  .nb-menu--roots .nb-menu__item[aria-current="true"] .nb-root__title { color: var(--text-cyan); }

  /* ---------- "On this page" bar: Fumadocs toc-popover (< 1280px) ---------- */
  .nb-tocbar { position: sticky; top: var(--nb-header-h); z-index: 30; background: var(--bg-page); border-bottom: 1px solid var(--border-subtle); }
  html.nb-is-full .nb-tocbar { display: none; }
  .nb-tocbar__btn {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    height: 44px;
    padding: 0 var(--nb-gutter);
    border: 0;
    background: none;
    color: var(--text-muted);
    font: var(--text-small);
    text-align: left;
    cursor: pointer;
  }
  .nb-tocbar__btn:focus-visible { outline-offset: -2px; }
  .nb-tocbar__current { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .nb-tocbar__chev { transition: transform var(--duration-spring) var(--ease-spring); }
  .nb-tocbar__btn[aria-expanded="true"] .nb-tocbar__chev { transform: rotate(180deg); }
  .nb-tocbar__panel { max-height: 55vh; overflow-y: auto; padding: 0 var(--nb-gutter) var(--space-4); }
  .nb-tocbar__panel[hidden] { display: none; }

  /* ---------- TOC: div#nd-toc ---------- */
  .nb-toc {
    flex: 0 0 var(--nb-toc-w);
    position: sticky;
    top: var(--nb-header-h);
    max-height: calc(100dvh - var(--nb-header-h));
    overflow-y: auto;
    padding: var(--space-12) var(--space-6) var(--space-8) 0;
  }
  html.nb-is-full .nb-toc { display: none; }
  .nb-toc__title { display: flex; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-3); font: var(--text-label); letter-spacing: .02em; color: var(--text-muted); }
  .nb-toc__list { position: relative; list-style: none; margin: 0; padding: 0 0 0 var(--space-3); }
  .nb-toc__list::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--border-subtle); }
  .nb-toc__thumb {
    position: absolute;
    left: -0.5px;
    width: 2px;
    top: 0;
    height: 0;
    border-radius: 1px;
    background: var(--text-cyan);
    transition: top var(--duration-fade) var(--ease-out), height var(--duration-fade) var(--ease-out);
  }
  .nb-toc__link {
    display: block;
    padding: 5px 0;
    color: var(--text-muted);
    font: var(--text-small);
    text-decoration: none;
    transition: color var(--duration-fade) var(--ease-out);
  }
  .nb-toc__link[data-depth="3"] { padding-left: var(--space-3); }
  .nb-toc__link:hover, .nb-toc__link.is-active { color: var(--text-primary); }
  .nb-toc__link:focus-visible { outline-offset: -2px; }
  .nb-toc__link code { font: 400 13px/20px var(--font-mono); }
  .nb-toc__foot { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); font: var(--text-small); color: var(--text-muted); }
  .nb-toc__foot p { margin: 0 0 var(--space-2); }
  .nb-feedback { display: flex; gap: var(--space-2); }

  @media (max-width: 1279px) { .nb-toc { display: none; } }
  @media (min-width: 1280px) { .nb-tocbar { display: none; } }

  /* ---------- article#nd-page ---------- */
  .nb-page { padding: var(--space-12) var(--nb-gutter) var(--space-24); }
  @media (max-width: 1279px) { .nb-page { padding-top: var(--space-8); } }
  .nb-head { padding-bottom: var(--space-6); margin-bottom: var(--space-8); border-bottom: 1px solid var(--border-subtle); }
  .nb-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); margin: 0 0 var(--space-4); padding: 0; list-style: none; font: var(--text-small); color: var(--text-muted); }
  .nb-crumbs a { color: var(--text-muted); text-decoration: none; }
  .nb-crumbs a:hover { color: var(--text-primary); }
  .nb-title { margin: 0; font-family: var(--font-display); font-size: 44px; line-height: 48px; font-weight: 700; letter-spacing: -0.015em; }
  .nb-title code { padding: .02em .16em .06em; border-radius: var(--radius-md); background: var(--bg-surface); font: 500 .8em/1 var(--font-mono); letter-spacing: -0.01em; }
  .nb-desc { margin: var(--space-3) 0 0; font: var(--text-body-lg); color: var(--text-muted); max-width: 64ch; }
  .nb-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-top: var(--space-6); }
  html[data-t-actions="hidden"] .nb-actions { display: none; }
  .nb-actions__edit { margin-left: auto; }
  .nb-actions .vc-btn--ghost { color: var(--text-muted); }
  .nb-actions .vc-btn--ghost:hover { color: var(--text-primary); }
  @media (max-width: 767px) {
    .nb-title { font-size: 34px; line-height: 40px; }
    .nb-actions__edit { margin-left: 0; }
  }

  /* ---------- prose: DocsBody ---------- */
  .nb-prose { font: var(--text-body); overflow-wrap: break-word; }
  .nb-prose > :first-child { margin-top: 0; }
  /* :where() keeps these at element specificity, so components inside the prose set their own spacing. */
  :where(.nb-prose) :is(p, ul, ol) { margin: 0 0 var(--space-4); }
  :where(.nb-prose) :is(ul, ol) { padding-left: var(--space-6); }
  :where(.nb-prose) li + li { margin-top: var(--space-1); }
  .nb-prose li::marker { color: var(--text-muted); }
  .nb-prose strong { font-weight: 600; }
  .nb-prose a:not([class]) { color: var(--text-cyan); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .nb-prose a:not([class]):hover { text-decoration-thickness: 2px; }
  .nb-prose h2, .nb-prose h3 { position: relative; scroll-margin-top: calc(var(--nb-header-h) + var(--nb-tocbar-h) + var(--space-6)); }
  .nb-prose h2 { margin: var(--space-12) 0 var(--space-4); font-family: var(--font-display); font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em; }
  .nb-prose h3 { margin: var(--space-8) 0 var(--space-2); font-family: var(--font-display); font-size: 21px; line-height: 28px; font-weight: 600; }
  .nb-prose h2 code, .nb-prose h3 code { font-size: .82em; font-weight: 500; }
  .nb-prose h2:focus, .nb-prose h3:focus { outline: none; }
  .nb-anchor { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-left: var(--space-1); vertical-align: middle; border-radius: var(--radius-sm); color: var(--text-muted); opacity: 0; transition: opacity var(--duration-fade) var(--ease-out); }
  :is(h2, h3):hover .nb-anchor, .nb-anchor:focus-visible { opacity: 1; }
  .nb-prose .vc-inline-code { overflow-wrap: anywhere; }
  .nb-prose .vc-callout { margin: var(--space-6) 0; }
  .nb-prose .vc-callout p + p { margin-top: var(--space-2); }
  .nb-lead { font: var(--text-body-lg); }

  /* Code blocks: vc-code with a title bar and copy button (Fumadocs CodeBlock / CodeBlockTabs) */
  .nb-code { margin: var(--space-6) 0; max-width: 100%; }
  .nb-code .vc-code__bar { gap: var(--space-3); min-height: 40px; }
  .nb-code__title { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nb-code pre code { font: inherit; }
  .nb-code .vc-code__copy { display: inline-flex; align-items: center; gap: var(--space-1); flex: none; }
  .nb-code .vc-code__copy:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .nb-code .m { color: var(--code-magenta); }
  .nb-pm .vc-code__bar { padding-block: 0; }
  .nb-pm__tabs { display: flex; align-self: stretch; gap: var(--space-1); }
  .nb-pm__tab {
    position: relative;
    padding: 0 var(--space-2);
    border: 0;
    background: none;
    color: var(--code-muted);
    font: var(--text-label);
    letter-spacing: .02em;
    cursor: pointer;
    transition: color var(--duration-fade) var(--ease-out);
  }
  .nb-pm__tab:hover { color: var(--code-fg); }
  .nb-pm__tab[aria-selected="true"] { color: var(--code-fg); }
  .nb-pm__tab[aria-selected="true"]::after { content: ""; position: absolute; left: var(--space-2); right: var(--space-2); bottom: 0; height: 2px; border-radius: 1px; background: var(--code-cyan); }
  .nb-pm__tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* Tables */
  .nb-table { margin: var(--space-6) 0; overflow-x: auto; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
  .nb-table table { width: 100%; border-collapse: collapse; font: var(--text-small); }
  .nb-table th { padding: var(--space-2) var(--space-3); background: var(--bg-surface); font-weight: 600; text-align: left; vertical-align: bottom; border-bottom: 1px solid var(--border-subtle); }
  .nb-table td { padding: var(--space-2) var(--space-3); vertical-align: top; border-top: 1px solid var(--border-subtle); }
  .nb-table tr:first-child td { border-top: 0; }
  .nb-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .nb-table td.num { white-space: nowrap; }
  .nb-table tr.is-default td { background: var(--bg-surface); font-weight: 600; }
  .nb-table caption { caption-side: bottom; padding: var(--space-2) var(--space-3); text-align: left; font: var(--text-small); color: var(--text-muted); border-top: 1px solid var(--border-subtle); }
  .nb-tag { font: var(--text-label); color: var(--text-muted); font-weight: 500; }
  .nb-table--prompts td:first-child .vc-inline-code { padding: 0; border: 0; background: none; font: 400 13px/20px var(--font-mono); color: var(--text-primary); }

  /* Steps (fd-steps) */
  .nb-steps { position: relative; margin: var(--space-6) 0; padding-left: 44px; counter-reset: nb-step; }
  .nb-steps::before { content: ""; position: absolute; left: 13.5px; top: 14px; bottom: var(--space-4); width: 1px; background: var(--border-subtle); }
  .nb-step { counter-increment: nb-step; }
  .nb-step + .nb-step { margin-top: var(--space-8); }
  .nb-steps .nb-step > h3 { margin-top: 0; }
  .nb-steps .nb-step > h3::before {
    content: counter(nb-step);
    position: absolute;
    left: -44px;
    top: 0;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill);
    background: var(--bg-page);
    color: var(--text-primary);
    font: 600 13px/1 var(--font-mono);
  }

  /* Files */
  .nb-files { margin: var(--space-6) 0; padding: var(--space-2); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-raised); }
  .nb-files ul { list-style: none; margin: 0; padding: 0; }
  .nb-files li + li { margin-top: 0; }
  .nb-files ul ul { margin-left: 15px; padding-left: var(--space-2); border-left: 1px solid var(--border-subtle); }
  .nb-files__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); padding: 6px var(--space-2); }
  .nb-files__row > .vc-icon { color: var(--text-muted); }
  .nb-files__name { font: 400 14px/20px var(--font-mono); }
  .nb-files__note { margin-left: auto; font: var(--text-small); color: var(--text-muted); }

  /* Cards */
  .nb-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin: var(--space-6) 0; }
  .nb-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    padding: var(--space-4);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    background: var(--bg-raised);
    color: var(--text-primary);
    text-decoration: none;
    transition: border-color var(--duration-fade) var(--ease-out);
  }
  .nb-card:hover { border-color: var(--border-strong); }
  .nb-card .nb-chip-icon { margin-bottom: var(--space-2); }
  .nb-card__title { display: flex; align-items: center; gap: var(--space-1); font: var(--text-ui); }
  .nb-card__title .vc-icon { color: var(--text-muted); transition: transform var(--duration-spring) var(--ease-spring); }
  .nb-card:hover .nb-card__title .vc-icon { transform: translateX(3px); color: var(--text-primary); }
  .nb-card__desc { font: var(--text-small); color: var(--text-muted); }
  .nb-card code { font: 400 .9em/1 var(--font-mono); }
  @media (max-width: 600px) { .nb-cards { grid-template-columns: minmax(0, 1fr); } }

  /* TypeTable */
  .nb-typetable { margin: var(--space-6) 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-raised); }
  .nb-typetable__row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-4); }
  .nb-typetable__row + .nb-typetable__row { border-top: 1px solid var(--border-subtle); }
  .nb-typetable__key { font: 600 15px/26px var(--font-mono); }
  .nb-typetable__q { margin: 0; font: var(--text-body-strong); }
  .nb-typetable__d { margin: var(--space-1) 0 0; font: var(--text-small); color: var(--text-muted); }
  .nb-typetable__meta { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin: var(--space-2) 0 0; font: var(--text-small); color: var(--text-muted); }
  .nb-typetable__meta b { font-weight: 600; color: var(--text-primary); }
  @media (max-width: 600px) { .nb-typetable__row { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }

  /* Worked example: custom MDX component <PixelRow> inside Fumadocs <Tabs> */
  .nb-px { margin: var(--space-6) 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-surface); overflow: hidden; }
  .nb-px__tabs { display: flex; gap: var(--space-1); padding: 0 var(--space-3); border-bottom: 1px solid var(--border-subtle); }
  .nb-px__tab { position: relative; height: 44px; padding: 0 var(--space-3); border: 0; background: none; color: var(--text-muted); font: 500 13px/16px var(--font-mono); cursor: pointer; transition: color var(--duration-fade) var(--ease-out); }
  .nb-px__tab:hover, .nb-px__tab[aria-selected="true"] { color: var(--text-primary); }
  .nb-px__tab[aria-selected="true"]::after { content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: -1px; height: 2px; border-radius: 1px; background: var(--text-cyan); }
  .nb-px__tab:focus-visible { outline-offset: -2px; }
  .nb-px__panel { padding: var(--space-6) var(--space-4) var(--space-4); background: var(--bg-page); }
  .nb-px__grid { display: grid; grid-template-columns: 88px repeat(10, minmax(0, 1fr)); gap: 4px; align-items: center; }
  .nb-px__label { font: var(--text-label); color: var(--text-muted); }
  .nb-px__n { text-align: center; font: var(--text-label); color: var(--text-muted); }
  .nb-px__cell { aspect-ratio: 1; max-height: 48px; border-radius: 2px; outline: 1px solid var(--border-subtle); }
  .nb-px__shift { text-align: center; font: 500 13px/20px var(--font-mono); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .nb-px__shift.is-counted { color: var(--text-magenta); font-weight: 700; }
  .nb-px__gap { grid-column: 1 / -1; height: var(--space-2); }
  .nb-px__result { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); }
  .nb-px__result p { margin: 0; flex: 1 1 260px; font: var(--text-small); color: var(--text-muted); }
  .nb-px__legend { margin: var(--space-3) 0 0; font: var(--text-small); color: var(--text-muted); }
  @media (max-width: 600px) {
    .nb-px__panel { padding-inline: var(--space-3); }
    .nb-px__grid { grid-template-columns: 64px repeat(10, minmax(0, 1fr)); gap: 2px; }
    .nb-px__shift { font-size: 11px; }
  }

  /* ---------- footer: last updated + prev/next ---------- */
  .nb-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4); margin-top: var(--space-12); padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); font: var(--text-small); color: var(--text-muted); }
  .nb-meta a { color: var(--text-muted); display: inline-flex; align-items: center; gap: var(--space-1); text-decoration: none; }
  .nb-meta a:hover { color: var(--text-primary); text-decoration: underline; text-underline-offset: 3px; }
  html[data-t-actions="shown"] .nb-meta__edit { display: none; }
  .nb-pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-6); }
  .nb-pager a {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    min-width: 0;
    padding: var(--space-4);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    color: var(--text-primary);
    text-decoration: none;
    transition: border-color var(--duration-fade) var(--ease-out), background-color var(--duration-fade) var(--ease-out);
  }
  .nb-pager a:hover { border-color: var(--border-strong); background: var(--bg-surface); }
  .nb-pager__dir { display: flex; align-items: center; gap: var(--space-1); font: var(--text-label); color: var(--text-muted); }
  .nb-pager__title { font: var(--text-ui); }
  .nb-pager__title code { font: 400 .9em/1 var(--font-mono); }
  .nb-pager__next { grid-column: 2; align-items: flex-end; text-align: right; }
  .nb-pager .vc-icon { transition: transform var(--duration-spring) var(--ease-spring); }
  .nb-pager__prev:hover .vc-icon { transform: translateX(-3px); }
  .nb-pager__next:hover .vc-icon { transform: translateX(3px); }

  /* ---------- docs home: a `full` page ---------- */
  .nb-hub__eyebrow { margin: 0 0 var(--space-3); color: var(--text-magenta); }
  .nb-hub__title { margin: 0; max-width: 18ch; }
  .nb-hub__lead { margin: var(--space-6) 0 0; max-width: 62ch; font: var(--text-body-lg); color: var(--text-muted); }
  .nb-hub__cta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); margin-top: var(--space-8); }
  .nb-chipwrap { display: grid; gap: var(--space-2); }
  .nb-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--space-3);
    height: 48px;
    padding: 0 var(--space-2) 0 var(--space-4);
    border: 1px solid var(--code-bg);
    border-radius: var(--radius-md);
    background: var(--code-bg);
    color: var(--code-fg);
    box-shadow: var(--shadow-register);
    font: var(--text-code);
    max-width: 100%;
  }
  [data-theme="dark"] .nb-chip { border-color: var(--border-subtle); }
  .nb-chip .p { color: var(--code-cyan); user-select: none; }
  .nb-chip__cmd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .nb-chip__copy {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex: none;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--code-muted);
    cursor: pointer;
    transition: color var(--duration-fade) var(--ease-out), background-color var(--duration-fade) var(--ease-out);
  }
  .nb-chip__copy:hover { color: var(--code-fg); background: color-mix(in srgb, var(--code-fg) 10%, transparent); }
  .nb-chip__copy:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .nb-pmswitch { display: flex; gap: var(--space-1); }
  .nb-pmswitch button {
    padding: 2px var(--space-2);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: none;
    color: var(--text-muted);
    font: var(--text-label);
    cursor: pointer;
    transition: color var(--duration-fade) var(--ease-out), border-color var(--duration-fade) var(--ease-out);
  }
  .nb-pmswitch button:hover { color: var(--text-primary); }
  .nb-pmswitch button[aria-pressed="true"] { color: var(--text-primary); border-color: var(--border-strong); }

  .nb-flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: var(--space-12) 0 0; padding: 0; list-style: none; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--bg-raised); }
  .nb-flow__step { position: relative; padding: var(--space-6); }
  .nb-flow__step + .nb-flow__step { border-left: 1px solid var(--border-subtle); }
  .nb-flow__arrow {
    position: absolute;
    left: -12px;
    top: calc(var(--space-6) + 26px);
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-pill);
    background: var(--bg-raised);
    color: var(--border-strong);
  }
  .nb-flow__arrow .vc-icon { width: 14px; height: 14px; }
  .nb-flow__n { margin: 0; font: var(--text-label); color: var(--text-muted); }
  .nb-flow__cmd { margin: var(--space-3) 0 var(--space-2); font: 600 17px/24px var(--font-mono); }
  .nb-flow__cmd span { color: var(--text-muted); font-weight: 400; }
  .nb-flow__desc { margin: 0; font: var(--text-small); color: var(--text-muted); }

  .nb-support { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) 0; margin-top: var(--space-4); padding: var(--space-3) 0; font: var(--text-small); color: var(--text-muted); }
  .nb-support__label { margin-right: var(--space-4); font: var(--text-label); color: var(--text-muted); }
  .nb-support__item { display: inline-flex; align-items: baseline; gap: var(--space-2); padding: 0 var(--space-4); border-left: 1px solid var(--border-subtle); color: var(--text-muted); text-decoration: none; }
  .nb-support__item:first-of-type { padding-left: 0; border-left: 0; }
  .nb-support__item b { font-weight: 600; color: var(--text-primary); }
  a.nb-support__item:hover b { color: var(--text-cyan); text-decoration: underline; text-underline-offset: 3px; }

  .nb-hub__section { margin-top: var(--space-12); }
  .nb-hub__h2 { margin: 0 0 var(--space-4); font-family: var(--font-display); font-size: 21px; line-height: 28px; font-weight: 600; }
  .nb-tasks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-4); }
  .nb-task {
    grid-column: span 2;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    padding: var(--space-6);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    background: var(--bg-raised);
    transition: border-color var(--duration-fade) var(--ease-out);
  }
  .nb-task:nth-child(n+4) { grid-column: span 3; }
  .nb-task:hover { border-color: var(--border-strong); }
  .nb-task__head { display: flex; align-items: center; gap: var(--space-3); }
  .nb-task__head .nb-chip-icon { width: 40px; height: 40px; }
  .nb-task__title { margin: 0; font-family: var(--font-display); font-size: 21px; line-height: 28px; font-weight: 600; }
  .nb-task__desc { margin: 0; font: var(--text-small); color: var(--text-muted); }
  .nb-task__links { list-style: none; margin: auto 0 0; padding: var(--space-2) 0 0; border-top: 1px solid var(--border-subtle); }
  .nb-task__links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    padding: 6px 0;
    color: var(--text-primary);
    font: var(--text-small);
    font-weight: 600;
    text-decoration: none;
  }
  .nb-task__links a .vc-icon { color: var(--text-muted); transition: transform var(--duration-spring) var(--ease-spring), color var(--duration-fade) var(--ease-out); }
  .nb-task__links a:hover { color: var(--text-cyan); }
  .nb-task__links a:hover .vc-icon { transform: translateX(3px); color: var(--text-cyan); }
  .nb-task__links code, .nb-browse code { font: 400 13px/20px var(--font-mono); }

  .nb-browse { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-6) var(--space-4); padding-top: var(--space-6); border-top: 1px solid var(--border-subtle); }
  .nb-browse__tab { margin: 0; display: flex; align-items: center; gap: var(--space-1); font: var(--text-label); color: var(--text-muted); }
  .nb-browse__group { margin: var(--space-1) 0 var(--space-3); font: var(--text-body-strong); }
  .nb-browse ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
  .nb-browse a { color: var(--text-muted); font: var(--text-small); text-decoration: none; }
  .nb-browse a:hover { color: var(--text-primary); text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 1100px) {
    .nb-tasks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .nb-task, .nb-task:nth-child(n+4) { grid-column: auto; }
    .nb-task:first-child { grid-column: 1 / -1; }
    .nb-browse { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 767px) {
    .nb-flow { grid-template-columns: minmax(0, 1fr); }
    .nb-flow__step + .nb-flow__step { border-left: 0; border-top: 1px solid var(--border-subtle); }
    .nb-flow__arrow { left: var(--space-6); top: -12px; transform: rotate(90deg); }
    .nb-tasks { grid-template-columns: minmax(0, 1fr); }
    .nb-browse { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .nb-support__item { padding: 0; border-left: 0; flex: 1 1 45%; }
    .nb-support__label { flex-basis: 100%; }
    .nb-chip { box-shadow: none; }
  }

  /* ---------- search dialog (Fumadocs SearchDialog) ---------- */
  .nb-search {
    width: min(640px, calc(100% - 16px));
    max-width: none;
    max-height: min(560px, calc(100dvh - 32px));
    margin: 12vh auto auto;
    padding: 0;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    background: var(--bg-raised);
    color: var(--text-primary);
    box-shadow: var(--shadow-raised);
    overflow: hidden;
  }
  .nb-search[open] { display: flex; flex-direction: column; }
  .nb-search:modal, .nb-drawer:modal { overscroll-behavior: contain; }
  .nb-search::backdrop, .nb-drawer::backdrop { background: var(--nb-overlay); overflow: hidden; overscroll-behavior: contain; }
  @media (max-width: 767px) { .nb-search { margin-top: var(--space-4); } }
  .nb-search__head { display: flex; align-items: center; gap: var(--space-3); height: 56px; padding: 0 var(--space-3) 0 var(--space-4); border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); }
  .nb-search__head:has(input:focus-visible) { box-shadow: inset 0 -2px 0 var(--focus); }
  .nb-search__input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--text-primary); font: var(--text-body-lg); }
  .nb-search__input:focus-visible { outline: none; }
  .nb-search__input::placeholder { color: var(--text-muted); }
  .nb-search__close { cursor: pointer; }
  .nb-search__label { margin: 0; padding: var(--space-3) var(--space-4) 0; font: var(--text-label); color: var(--text-muted); }
  .nb-search__list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; list-style: none; margin: 0; padding: var(--space-2); }
  .nb-search__opt { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); cursor: pointer; }
  .nb-search__opt > .vc-icon { margin-top: 2px; color: var(--text-muted); }
  .nb-search__opt[aria-selected="true"] { background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .nb-search__opt[aria-selected="true"] .nb-search__t { color: var(--text-cyan); }
  .nb-search__body { display: grid; min-width: 0; }
  .nb-search__t { font: var(--text-ui); font-size: 15px; }
  .nb-search__s { font: var(--text-small); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nb-search__t code, .nb-search__s code { font: 400 .9em/1 var(--font-mono); }
  .nb-search mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--text-cyan); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .nb-search__empty { padding: var(--space-8) var(--space-4); text-align: center; font: var(--text-small); color: var(--text-muted); }
  .nb-search__foot { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border-subtle); font: var(--text-small); color: var(--text-muted); }
  .nb-search__foot span { display: inline-flex; align-items: center; gap: var(--space-1); }
  @media (max-width: 767px) { .nb-search__foot { display: none; } }

  /* ---------- drawer (mobile sidebar) ---------- */
  .nb-drawer {
    width: min(85vw, 380px);
    max-width: none;
    height: 100dvh;
    max-height: none;
    margin: 0 0 0 auto;
    padding: 0;
    border: 0;
    border-left: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    color: var(--text-primary);
    transform: translateX(100%);
    transition: transform var(--duration-spring) var(--ease-out), overlay var(--duration-spring) allow-discrete, display var(--duration-spring) allow-discrete;
  }
  .nb-drawer[open] { display: flex; flex-direction: column; transform: none; }
  @starting-style { .nb-drawer[open] { transform: translateX(100%); } }
  .nb-drawer__head { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 var(--space-2) 0 var(--space-4); border-bottom: 1px solid var(--border-subtle); flex: none; }
  .nb-drawer__head img { height: 22px; width: auto; }
  .nb-drawer__body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-4); }
  .nb-drawer .nb-side-link, .nb-drawer .nb-folder__btn { padding-block: 10px; }
  .nb-roots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); margin-bottom: var(--space-6); }
  .nb-roots a {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    color: var(--text-muted);
    font: var(--text-ui);
    font-size: 14px;
    text-decoration: none;
  }

<!-- Getting started: content/docs/(guides)/getting-started.mdx. Fumadocs: Callout, Steps (`### Run init [step]`),
     ```npm fences (package-manager tabs with `persist`), Files, code blocks with `title`, Cards. -->
<template id="tpl-getting-started">
  <p class="nb-lead">visual-check captures a snapshot of every story and compares it with a baseline you commit. Setting it up takes three commands: <code>init</code> writes the setup, <code>update</code> writes the first baselines, and <code>test</code> checks the stories against them.</p>

  <div class="vc-callout" role="note">
    <span class="vc-callout__glyph" aria-hidden="true">i</span>
    <div>
      <strong class="vc-callout__title">Readiness never waits for the network</strong>
      <p>visual-check captures a story once it has finished and its images and fonts have loaded. It doesn't wait for requests that come later. So when a story fails on your first <code>test</code>, the story needs tuning: a <code>wait</code> hook, a mask, or a look at its animations. <a href="#getting-started/first-test-fails">What to do when it fails</a>.</p>
    </div>
  </div>

  <h2 id="before-you-start">Before you start</h2>
  <ul>
    <li>Node 22.17 or later.</li>
    <li>Storybook 9.1, 10 or 11, with a script that starts it.</li>
    <li>Docker, running. The browser runs in visual-check's container, so your machine and CI render the same pixels. To run without Docker, see <a href="#platforms-and-docker">Platforms and Docker</a>.</li>
    <li>npm, pnpm, Yarn 1, Yarn 4.17.1 or later, or Bun.</li>
  </ul>

  <h2 id="set-it-up">Set it up</h2>
  <div class="nb-steps">
    <div class="nb-step">
      <h3 id="run-init">Run <code>init</code></h3>
      <p>Run it at the root of your repository. <code>init</code> installs visual-check's packages itself, so there's nothing to install first.</p>
      <figure class="vc-code nb-code nb-pm" data-pm="dlx" data-arg="@visual-check/cli init"></figure>
      <p>It finds your workspace and package manager, every Storybook with the script that starts it and its port, Docker, and each Storybook's version. Then it asks a few questions, writes the setup, and installs the packages. It never pulls the browser, starts Storybook or captures anything.</p>
      <p>Yarn 4 refuses a version published less than a day ago. On a release day, wait a day, or list <code>@visual-check/*</code> under <code>npmPreapprovedPackages</code> in <code>.yarnrc.yml</code>.</p>
      <p>It ends with the next steps, which are the rest of this page:</p>
      <figure class="vc-code nb-code">
        <figcaption class="vc-code__bar">
          <span class="nb-code__title">Terminal</span>
          <button class="vc-code__copy" type="button" data-copy-code>Copy</button>
        </figcaption>
        <pre data-closing></pre>
      </figure>
    </div>

    <div class="nb-step">
      <h3 id="start-storybook">Start Storybook</h3>
      <p>visual-check connects to a Storybook that's already running, and never starts or builds one. Start it with its usual script and leave it running.</p>
      <figure class="vc-code nb-code nb-pm" data-pm="run" data-arg="storybook"></figure>
      <p>visual-check opens it at the URL in <code>visual-check.config.ts</code>. <code>init</code> writes it as <code>http://127.0.0.1:6006</code>, never <code>localhost</code>.</p>
    </div>

    <div class="nb-step">
      <h3 id="write-baselines">Write the first baselines</h3>
      <figure class="vc-code nb-code nb-pm" data-pm="run" data-arg="visual:update"></figure>
      <p><code>update</code> captures each story, checks that it renders the same way twice, and writes its baseline to <code>.visual-check/baselines/</code>. A new baseline takes about a second: two loads and three captures. <code>test</code> and CI never pay this.</p>
      <figure class="vc-code nb-code">
        <figcaption class="vc-code__bar">
          <span class="nb-code__title">Terminal</span>
          <button class="vc-code__copy" type="button" data-copy-code>Copy</button>
        </figcaption>
<pre><span class="c">visual-check 0.1.0 · update · 24 snapshots · 7 workers</span>
<span class="s">✓</span> web  components-button--primary  written: missing
<span class="s">✓</span> web  components-button--secondary  written: missing
<span class="s">✓</span> web  components-card--default  written: missing
<span class="c">…</span>
24 written
<span class="c">written .visual-check/baselines/components-button--primary.png</span>
<span class="c">…</span></pre>
      </figure>
      <p>If it ends with a warning about remote content or real network requests, those stories can render differently on another machine. Read <a href="#remote-content">Remote content</a> before you commit. <code>update</code> runs only on your machine: with <code>CI</code> set, it stops with exit code 2.</p>
    </div>

    <div class="nb-step">
      <h3 id="check-stories">Check the stories</h3>
      <figure class="vc-code nb-code nb-pm" data-pm="run" data-arg="visual:check"></figure>
      <p>Run locally, <code>test</code> covers the affected stories: the ones your changes since the base branch reach. Until you commit, the new config file counts as a change, so this first run covers every story. In a terminal, passing snapshots print nothing; only failures and a progress line do.</p>
      <figure class="vc-code nb-code">
        <figcaption class="vc-code__bar">
          <span class="nb-code__title">Terminal</span>
          <button class="vc-code__copy" type="button" data-copy-code>Copy</button>
        </figcaption>
<pre><span class="c">visual-check 0.1.0 · test · 24 snapshots · 7 workers</span>
24 passed · 6.2s
<span class="c">Report: .visual-check/report/report.json</span></pre>
      </figure>
      <p>It exits with 0 when every snapshot matches its baseline, 1 when something in your stories needs a look, and 2 when visual-check couldn't run, for example because Storybook doesn't answer.</p>
    </div>

    <div class="nb-step">
      <h3 id="commit">Commit the baselines</h3>
      <figure class="vc-code nb-code">
        <figcaption class="vc-code__bar">
          <span class="nb-code__title">Terminal</span>
          <button class="vc-code__copy" type="button" data-copy-code>Copy</button>
        </figcaption>
<pre><span class="p">$ </span>git add .
<span class="p">$ </span>git commit -m <span class="s">"Set up visual-check"</span></pre>
      </figure>
      <p>Commit <code>.visual-check/baselines/</code> with the rest of the setup. The <code>.gitignore</code> files <code>init</code> wrote keep the report out of git. From now on only <code>update</code>, run by a person, writes baselines. CI only checks them.</p>
    </div>
  </div>

  <h2 id="what-init-asks">What <code>init</code> asks</h2>
  <p>Each question shows a hint and a default. Arrows choose and Enter accepts. <code>init --yes</code> takes every default.</p>
  <figure class="vc-code nb-code">
    <figcaption class="vc-code__bar"><span class="nb-code__title">Terminal</span></figcaption>
<pre><span class="s">✓</span><span class="m">✓</span> visual-check init <span class="c">· v0.1.0</span>
<span class="s">━━━━━━━━━━━━━━━</span><span class="c">─────</span> <span class="c">Step 5 of 6</span>

<span class="s">✓</span> Name of the Storybook in <span class="s">acme</span>  web
<span class="s">✓</span> URL of <span class="s">web</span>  http://127.0.0.1:6006
<span class="s">✓</span> Name of the script that runs visual-check test  visual:check
<span class="s">✓</span> Name of the script that runs visual-check update  visual:update
<span class="m">?</span> Install the agent skill?
  <span class="c">Teaches a coding agent to run visual-check and report what changed.</span>
<span class="s">›</span> ● Yes  ○ No</pre>
  </figure>
  <div class="nb-table nb-table--prompts">
    <table>
      <thead><tr><th scope="col">Question</th><th scope="col">Asked</th><th scope="col">Default</th></tr></thead>
      <tbody>
        <tr><td><code>Package manager</code></td><td>When no lockfile or <code>packageManager</code> field names one</td><td>npm</td></tr>
        <tr><td><code>Storybooks to set up</code></td><td>When there's more than one</td><td>All ticked</td></tr>
        <tr><td><code>Name of the Storybook in apps/web</code></td><td>For each Storybook</td><td>The package's name</td></tr>
        <tr><td><code>URL of web</code></td><td>For each Storybook</td><td><code>http://127.0.0.1:</code> and the port its script sets</td></tr>
        <tr><td><code>Command that starts web</code></td><td>When no script starts it</td><td>None</td></tr>
        <tr><td><code>Name of the script that runs visual-check test</code></td><td>Always</td><td><code>visual:check</code></td></tr>
        <tr><td><code>Name of the script that runs visual-check update</code></td><td>Always</td><td><code>visual:update</code></td></tr>
        <tr><td><code>Install the agent skill?</code></td><td>Always</td><td>Yes</td></tr>
        <tr><td><code>Add the Storybook addon to web?</code></td><td>For Storybook 10 only</td><td>Yes</td></tr>
      </tbody>
    </table>
  </div>
  <p>It never asks about the platform, tolerance or workers. Their defaults suit most projects, and <a href="#config">Config</a> lists every one.</p>

  <h2 id="what-init-writes">What <code>init</code> writes</h2>

  <p>And <code>.storybook/visual-check.ts</code> is where you declare modes and set options for every story:</p>

<pre><span class="k">import</span> { defineVisualCheck } <span class="k">from</span> <span class="s">'@visual-check/storybook'</span>

<span class="c">// To set options for every story, spread visualCheck into the parameters in your preview file:</span>
<span class="c">//   import { visualCheck } from './visual-check'</span>
<span class="c">//   parameters: { ...visualCheck({}) },</span>
<span class="k">export const</span> visualCheck = defineVisualCheck({
  modes: {
    <span class="c">// Each mode a story lists adds one snapshot besides its default capture. For example:</span>
    <span class="c">// mobile: { viewport: { width: 375, height: 667, deviceScaleFactor: 2, touch: true } },</span>

})</pre>
  </figure>
  <p>It never edits your <code>preview</code> file, your other scripts or the root <code>.gitignore</code>, and it touches <code>main</code> only through <code>storybook add</code> when you add the addon. It writes no CI workflow: <a href="#ci">CI</a> shows the one to add.</p>
  <p>In a monorepo, the config goes at the workspace root, and each Storybook's package gets its own <code>visual-check.ts</code>, <code>.gitignore</code> and a pair of scripts that check only that Storybook.</p>

  <h2 id="first-test-fails">If the first <code>test</code> fails</h2>
  <p>A failure on the first run almost always means a story doesn't render the same way twice. visual-check runs each story as plain Storybook does and doesn't wait for the network, so the snapshot shows exactly what a fresh load looks like.</p>
  <div class="nb-table">
    <table>
      <thead><tr><th scope="col">What you see</th><th scope="col">Fix</th></tr></thead>
      <tbody>
        <tr><td>Content that arrives late: data, icons, a chart</td><td>A <a href="#wait-hook"><code>wait</code> hook</a> that waits for it</td></tr>
        <tr><td>Something different on every load: a clock, random data</td><td>A mask over it</td></tr>
        <tr><td>An animation that isn't at its end state</td><td>A mask or a <code>wait</code> hook. See <a href="#animations">Animations</a></td></tr>
        <tr><td>An image from a CDN that differs by machine</td><td>See <a href="#remote-content">Remote content</a></td></tr>
      </tbody>
    </table>
  </div>
  <p>Set both on the story with the <code>visualCheck</code> helper:</p>
  <figure class="vc-code nb-code">
    <figcaption class="vc-code__bar">
      <span class="nb-code__title">src/card.stories.tsx</span>
      <button class="vc-code__copy" type="button" data-copy-code>Copy</button>
    </figcaption>
<pre><span class="k">import type</span> { Meta, StoryObj } <span class="k">from</span> <span class="s">'@storybook/react-vite'</span>
<span class="k">import</span> { visualCheck } <span class="k">from</span> <span class="s">'../.storybook/visual-check'</span>

<span class="k">const</span> meta = { title: <span class="s">'Components/Card'</span> } <span class="k">satisfies</span> Meta
<span class="k">export default</span> meta
<span class="k">type</span> Story = StoryObj&lt;<span class="k">typeof</span> meta&gt;

<span class="k">export const</span> Default: Story = {
  parameters: {
    ...visualCheck({
      masks: { clock: { selector: <span class="s">'[data-clock]'</span> } },
      wait: <span class="k">async</span> ({ canvas }) =&gt; {
        <span class="k">await</span> canvas.findByText(<span class="s">'Late content'</span>)
      },
    }),
  },
}</pre>
  </figure>
  <p>Then run <code>update</code> and <code>test</code> again.</p>

<template id="tpl-color-and-pixels">
  <p class="nb-lead">A snapshot passes when it differs from its baseline by no more than the story's tolerance. The default is <code>{ color: 0.01, pixels: 20 }</code> on every platform.</p>

  <div class="nb-typetable">
    <div class="nb-typetable__row">
      <div class="nb-typetable__key">color</div>
      <div>
        <p class="nb-typetable__q">Did this pixel change?</p>
        <p class="nb-typetable__d">How far a pixel's colour may move and still count as unchanged. At <code>0.01</code>, a grey shift of up to about 2 of 255 doesn't count.</p>
        <p class="nb-typetable__meta"><span>Type <b>a number from 0 to 1</b></span><span>Default <b>0.01</b></span></p>
      </div>
    </div>
    <div class="nb-typetable__row">
      <div class="nb-typetable__key">pixels</div>
      <div>
        <p class="nb-typetable__q">How many changed pixels are allowed?</p>
        <p class="nb-typetable__d">A count of CSS pixels, or a share of the image written as a percent string.</p>
        <p class="nb-typetable__meta"><span>Type <b>a whole number, or <code>'0%'</code> to <code>'100%'</code></b></span><span>Default <b>20</b></span></p>
      </div>
    </div>
  </div>

  <h2 id="how-it-compares">How a snapshot is compared</h2>
  <ol>
    <li>Identical bytes pass at once, with nothing decoded. On unchanged snapshots that happens 98–99% of the time.</li>
    <li>A different width or height fails, whatever the tolerance says.</li>
    <li>Otherwise each pixel is compared with its baseline pixel, and <code>color</code> decides whether it counts as changed.</li>
    <li>If more pixels changed than <code>pixels</code> allows, the snapshot fails, and visual-check draws its visual diff.</li>
  </ol>

  <h2 id="worked-example">A worked example with ten pixels</h2>
  <p>Take one row of ten grey pixels from a button. The snapshot was captured on another machine, so three pixels moved by a level or two. The button's label also moved, which changed two pixels a lot. Scaled down to this row, say the budget is <code>pixels: 1</code>.</p>
  <div class="nb-px" data-pixel-example></div>
  <p>At <code>0.01</code> the noise doesn't count and the change does, so the change is caught. At <code>0</code> the noise counts too. A snapshot of the same story with no change at all would then have 3 changed pixels and fail. To let it pass, the budget would have to rise to 3, and a real change of up to 3 pixels would pass unnoticed. The table below is the same trade, measured on real stories.</p>

  <h2 id="measured-table">The measured table behind the defaults</h2>
  <p>The defaults come from 606 stories of a real Storybook, captured in Chromium on amd64 runners and on arm64. Each deliberate change was made on arm64 and compared with an amd64 baseline. For each <code>color</code>, the budget is the smallest that lets every arm64 snapshot pass. The other columns count how many changes that budget still catches.</p>
  <div class="nb-table">
    <table>
      <thead>
        <tr>
          <th scope="col"><code>color</code></th>
          <th scope="col" class="num">Budget that absorbs arm64</th>
          <th scope="col" class="num">1 px shift (606)</th>
          <th scope="col" class="num">One character (533)</th>
          <th scope="col" class="num">Hidden icon (286)</th>
          <th scope="col" class="num">Background ±4 (517)</th>
          <th scope="col" class="num">±8 (517)</th>
          <th scope="col" class="num">±16 (518)</th>
        </tr>
      </thead>
      <tbody>
        <tr><td><code>0</code></td><td class="num">18,859 px</td><td class="num">45</td><td class="num">1</td><td class="num">1</td><td class="num">50</td><td class="num">50</td><td class="num">50</td></tr>
        <tr><td><code>0.005</code></td><td class="num">3,054 px</td><td class="num">305</td><td class="num">15</td><td class="num">1</td><td class="num">310</td><td class="num">312</td><td class="num">312</td></tr>
        <tr class="is-default"><td><code>0.01</code> <span class="nb-tag">default</span></td><td class="num">19 px</td><td class="num">606</td><td class="num">527</td><td class="num">285</td><td class="num">462</td><td class="num">481</td><td class="num">505</td></tr>
        <tr><td><code>0.02</code></td><td class="num">0</td><td class="num">606</td><td class="num">533</td><td class="num">286</td><td class="num">3</td><td class="num">453</td><td class="num">492</td></tr>
        <tr><td><code>0.05</code></td><td class="num">0</td><td class="num">604</td><td class="num">533</td><td class="num">286</td><td class="num">1</td><td class="num">0</td><td class="num">444</td></tr>
        <tr><td><code>0.1</code></td><td class="num">0</td><td class="num">601</td><td class="num">533</td><td class="num">286</td><td class="num">0</td><td class="num">0</td><td class="num">0</td></tr>
      </tbody>
      <caption>Chromium, scale 1, every pixel counted. Numbers in brackets are the stories where the change was visible.</caption>
    </table>
  </div>
  <ul>
    <li>At <code>0.01</code>, a 19 px budget absorbs every arm64 difference and still catches every 1 px shift, 99% of one-character changes and hidden icons, and 89% of 4-level background changes. The default rounds the budget up to 20.</li>
    <li>On the default platform, <code>linux/amd64</code>, runners and Rosetta differ by at most 2 px at <code>0.01</code>, so the default has room to spare.</li>
    <li><code>0.1</code> is the comparison library's own default. At <code>0.1</code>, no background change of up to 16 levels per channel was caught.</li>
  </ul>

  <h2 id="set-tolerance">Set tolerance</h2>
  <p>Tolerance is the same object at every level: the config for the whole project, <code>preview</code> for a Storybook, a stories file's meta, and a story. Levels merge, so a level can set only <code>color</code> or only <code>pixels</code>.</p>
  <figure class="vc-code nb-code">
    <figcaption class="vc-code__bar">
      <span class="nb-code__title">src/dashboard.stories.tsx</span>
      <button class="vc-code__copy" type="button" data-copy-code>Copy</button>
    </figcaption>
<pre><span class="k">export const</span> Dashboard: Story = {
  parameters: {
    ...visualCheck({ tolerance: { pixels: <span class="s">'0.05%'</span> } }),
  },
}</pre>
  </figure>

  <h2 id="percent-strings">Percent strings</h2>
  <p>The type of <code>pixels</code> sets its unit:</p>
  <div class="nb-table">
    <table>
      <thead><tr><th scope="col">Value</th><th scope="col">Means</th></tr></thead>
      <tbody>
        <tr><td>A whole number, 0 or more, such as <code>20</code></td><td>A count of changed CSS pixels</td></tr>
        <tr><td>A string from <code>'0%'</code> to <code>'100%'</code>, such as <code>'0.1%'</code></td><td>A share of the image's own pixels</td></tr>
        <tr><td>Anything else, such as <code>1.5</code>, <code>-1</code> or <code>'0.1'</code></td><td>visual-check stops with exit code 2, naming the story</td></tr>
      </tbody>
    </table>
  </div>
  <ul>
    <li>A share is counted against the image's own pixels and rounded down. On a 1280×720 snapshot, <code>'0.1%'</code> allows 921 pixels.</li>
    <li>A share isn't scaled by the device scale factor, because it's already relative to the image.</li>
    <li>A level sets a count or a share, never both. Each level replaces the budget it inherits.</li>
  </ul>

  <h2 id="css-pixels">CSS pixels at scale 2</h2>
  <p>A count is in CSS pixels. At device scale factor <em>s</em>, a snapshot may have ⌊<code>pixels</code> × <em>s</em>²⌋ changed image pixels.</p>
  <div class="nb-table">
    <table>
      <thead><tr><th scope="col">Scale</th><th scope="col" class="num"><code>pixels: 20</code> allows</th></tr></thead>
      <tbody>
        <tr><td>1</td><td class="num">20 image pixels</td></tr>
        <tr><td>1.5</td><td class="num">45 image pixels</td></tr>
        <tr><td>2</td><td class="num">80 image pixels</td></tr>
      </tbody>
    </table>
  </div>
  <p>A failure shows image pixels against the scaled budget:</p>
  <figure class="vc-code nb-code">
    <figcaption class="vc-code__bar">
      <span class="nb-code__title">Terminal</span>
      <button class="vc-code__copy" type="button" data-copy-code>Copy</button>
    </figcaption>
<pre><span class="m">✗</span> web  components-modal--default  mobile  differs: <span class="m">84 differ</span>, 80 allowed (20 at scale 2)</pre>
  </figure>
  <p>The defaults were measured at scale 1, and phone modes are recommended at scale 2. At scale 2 a deliberate change covers 3 to 4 times as many image pixels, and arm64's noise needs 69 px where it needed 19. An unscaled 20 would fail arm64 there. 80 absorbs it and catches nearly as much as 20 does at scale 1:</p>
  <div class="nb-table">
    <table>
      <thead><tr><th scope="col"></th><th scope="col" class="num">Scale 1, 20 allowed</th><th scope="col" class="num">Scale 2, 80 allowed</th></tr></thead>
      <tbody>
        <tr><td>Budget that absorbs arm64</td><td class="num">19 px</td><td class="num">69 px</td></tr>
        <tr><td>1 px shift caught (606)</td><td class="num">606</td><td class="num">606</td></tr>
        <tr><td>One character caught (533)</td><td class="num">527</td><td class="num">516</td></tr>
        <tr><td>Hidden icon caught (286)</td><td class="num">285</td><td class="num">269</td></tr>
      </tbody>
    </table>
  </div>

  <h2 id="anti-aliasing">Why anti-aliased pixels count</h2>
  <p>Every pixel counts, the anti-aliased edges of text and icons included. There's no option to change this in v1.</p>
  <p>Some tools skip a changed pixel when it looks like an anti-aliased edge. Text and icons are mostly edges, so that skip hides real changes. Measured on the same stories at the default tolerance:</p>
  <div class="nb-table">
    <table>
      <thead><tr><th scope="col"></th><th scope="col" class="num">Every pixel counts</th><th scope="col" class="num">Edges skipped</th></tr></thead>
      <tbody>
        <tr><td>Budget that absorbs runner noise</td><td class="num">2 px</td><td class="num">0 px</td></tr>
        <tr><td>1 px shift caught</td><td class="num">606 of 606</td><td class="num">596 of 606</td></tr>
        <tr><td>One character caught</td><td class="num">488 of 494</td><td class="num">476 of 494</td></tr>
        <tr><td>Hidden icon caught</td><td class="num">259 of 260</td><td class="num">118 of 260</td></tr>
      </tbody>
    </table>
  </div>
  <p>The container leaves almost no noise on the default platform, so skipping edges has little to absorb. With the default budget it would miss more than half of hidden icons.</p>

  <h2 id="lower-color">Why a lower <code>color</code> isn't stricter</h2>
  <p>Lowering <code>color</code> looks like a way to catch smaller changes. It catches fewer. Below <code>0.01</code>, noise starts to count as change, so the budget has to grow to absorb it, and a bigger budget lets real changes through. At <code>0</code>, the budget that absorbs arm64 is 18,859 px, and it catches 45 of 606 one-pixel shifts.</p>
  <p>To be stricter, lower <code>pixels</code> instead, and keep every machine on the default platform.</p>
  <div class="vc-callout vc-callout--warning" role="note">
    <span class="vc-callout__glyph" aria-hidden="true">!</span>
    <div>
      <strong class="vc-callout__title">Don't raise tolerance to make a snapshot pass</strong>
      <p>If a story renders differently between loads, it's a flaky snapshot, and the fix is in the story: a mask or a <code>wait</code> hook. See <a href="#flaky-snapshots">Flaky snapshots</a>.</p>
    </div>
  </div>

  <h2 id="size-differences">Size differences</h2>
  <p>A snapshot whose width or height differs from its baseline always fails, whatever <code>pixels</code> and the masks say. Noise moves colours, not layout, so a size change is never noise. The message names both sizes, as in <code>size changed: 1280×2400 → 1280×2432</code>. The visual diff pads the smaller image to the larger size, and every padded pixel counts.</p>
  <p>In the visual diff, changed pixels are magenta over a faded copy of the baseline, and padding is cyan.</p>
