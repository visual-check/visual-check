    html += '</div>';
    html += '<p class="nb-px__legend">Shift is in levels of 255. In the visual diff, counted pixels are magenta over a faded baseline.</p>';
    html += '<div class="nb-px__result"><span class="vc-badge vc-badge--changed"><span class="vc-badge__glyph" aria-hidden="true">✗</span>differs</span><code class="vc-inline-code">' + item.result + '</code><p>' + escapeHtml(item.note) + '</p></div>';
    panel.innerHTML = html;
    container.querySelectorAll('.nb-px__tab').forEach(function (button, index) {
      button.setAttribute('aria-selected', String(index === caseIndex));
      button.tabIndex = index === caseIndex ? 0 : -1;
    });
  }

  /**
   * A text equivalent of the pixel grid for screen readers.
   */
  function describePixels(item, shifts) {
    var counted = [];
    shifts.forEach(function (shift, index) {
      if (shift > item.limit) {
        counted.push(index + 1);
      }
    });
    return 'Ten pixels. Shifts in levels: ' + shifts.join(', ') + '. At ' + item.label + ', pixels ' + counted.join(', ') + ' count as changed.';
  }

  /* ======================================================================
     Chrome: header nav, tabs, sidebar, root switcher, drawer
     ====================================================================== */
  var tabsNav = document.getElementById('nb-tabs');
  var sidebarHead = document.getElementById('nb-sidebar-head');
  var sidebarTree = document.getElementById('nb-sidebar-tree');
  var drawerBody = document.getElementById('nb-drawer-body');
  var drawer = document.getElementById('nb-drawer');
  var article = document.getElementById('nd-page');
  var tocAside = document.getElementById('nd-toc');
  var tocbarButton = document.getElementById('nb-tocbar-btn');
  var tocbarPanel = document.getElementById('nb-tocbar-panel');
  var tocbarCurrent = document.getElementById('nb-tocbar-current');
  var openMenu = document.getElementById('nb-open-menu');
  var rootMenu = document.getElementById('nb-root-menu');
  var openFolders = { guides: true };
  var currentSlug = null;

  /**
   * Finds a root folder by id.
   */
  function tabById(id) {
    return TABS.filter(function (tab) {
      return tab.id === id;
    })[0];
  }

  /**
   * Marks the shared header's nav: Storybook addon and Agent skill have their own links, the rest is Docs.
   */
  function paintHeaderNav(slug) {
    var key = slug === 'storybook-addon' || slug === 'agent-skill' ? slug : 'docs';
    document.querySelectorAll('.vc-header__nav a[data-nav]').forEach(function (link) {
      if (link.getAttribute('data-nav') === key) {
        link.setAttribute('aria-current', 'page');
      } else {
        link.removeAttribute('aria-current');
      }
    });
  }

  /**
   * Header tabs: one per root folder, linking to its first page.
   */
  function paintTabs(tabId) {
    tabsNav.innerHTML = TABS.map(function (tab) {
      var first = tab.groups[0].pages[0];
      return '<a class="nb-tab" href="#' + first + '"' + (tab.id === tabId ? ' aria-current="page"' : '') + '>' + icon(tab.icon) + tab.title + '</a>';
    }).join('');
  }

  /**
   * One sidebar link.
   */
  function itemHTML(slug, current) {
    return '<li><a class="nb-side-link" href="#' + slug + '"' + (slug === current ? ' aria-current="page"' : '') + '>' + md(PAGES[slug].title) + '</a></li>';
  }

  /**
   * The groups of one root folder: separator label, then its pages.
   */
  function groupsHTML(tab, current, idPrefix) {
    return tab.groups.map(function (group, index) {
      var labelId = idPrefix + '-' + tab.id + '-' + index;
      var label = group.label ? '<p class="nb-side-sep" id="' + labelId + '">' + group.label + '</p>' : '';
      var list = '<ul class="nb-side-list"' + (group.label ? ' aria-labelledby="' + labelId + '"' : '') + '>' + group.pages.map(function (slug) {
        return itemHTML(slug, current);
      }).join('') + '</ul>';
      return '<div class="nb-side-group">' + label + list + '</div>';
    }).join('');
  }

  /**
   * The page tree for the sidebar or the drawer. Inside a root folder it lists that folder; on the docs home, which sits
   * outside every root folder, it lists the root folders as collapsible folders.
   */
  function treeHTML(slug, idPrefix) {
    var page = PAGES[slug];
    if (page.tab) {
      return groupsHTML(tabById(page.tab), slug, idPrefix);
    }
    return TABS.map(function (tab) {
      var open = !!openFolders[tab.id];
      var bodyId = idPrefix + '-folder-' + tab.id;
      return '<div class="nb-folder">' +
        '<button class="nb-folder__btn" type="button" aria-expanded="' + String(open) + '" aria-controls="' + bodyId + '" data-folder="' + tab.id + '">' +
          icon(tab.icon) + tab.title + icon('chevRight', 'nb-folder__chev') +
        '</button>' +
        '<div class="nb-folder__body" id="' + bodyId + '"' + (open ? '' : ' hidden') + '>' + groupsHTML(tab, slug, idPrefix) + '</div>' +
      '</div>';
    }).join('');
  }

  /**
   * The root-folder switcher button (SidebarTabsDropdown).
   */
  function switcherHTML(tabId) {
    var tab = tabById(tabId);
    if (!tab) {
      return '';
    }
    return '<button class="nb-root" type="button" popovertarget="nb-root-menu" aria-label="Docs section: ' + tab.title + '. Change section">' +
      '<span class="nb-root__icon">' + icon(tab.icon) + '</span>' +
      '<span class="nb-root__text"><span class="nb-root__title">' + tab.title + '</span><span class="nb-root__desc">' + tab.desc + '</span></span>' +
      icon('upDown') +
    '</button>';
  }

  /**
   * The root-folder list inside the switcher popover.
   */
  function paintRootMenu(tabId) {
    rootMenu.innerHTML = TABS.map(function (tab) {
      var current = tab.id === tabId;
      return '<a class="nb-menu__item" href="#' + tab.groups[0].pages[0] + '"' + (current ? ' aria-current="true"' : '') + '>' +
        '<span class="nb-root__icon">' + icon(tab.icon) + '</span>' +
        '<span class="nb-root__text"><span class="nb-root__title">' + tab.title + '</span><span class="nb-root__desc">' + tab.desc + '</span></span>' +
        (current ? '<span class="nb-menu__end">' + icon('check') + '</span>' : '') +
      '</a>';
    }).join('');
  }

  /**
   * Sidebar, root switcher and drawer for the current page.
   */
  function paintNavigation(slug) {
    var page = PAGES[slug];
    sidebarHead.innerHTML = switcherHTML(page.tab);
    paintRootMenu(page.tab);
    sidebarTree.innerHTML = treeHTML(slug, 'side');
    var drawerRoots = '<nav class="nb-roots" aria-label="Docs sections">' + TABS.map(function (tab) {
      return '<a href="#' + tab.groups[0].pages[0] + '"' + (tab.id === page.tab ? ' aria-current="true"' : '') + '>' + icon(tab.icon) + tab.title + '</a>';
    }).join('') + '</nav>';
    drawerBody.innerHTML = drawerRoots +
      '<nav aria-label="Pages in this section">' + treeHTML(slug, 'drawer') + '</nav>' +
      '<nav class="nb-drawer__site" aria-label="Site">' +
        '<a href="#home">Docs home</a>' +
        '<a href="https://github.com/visual-check/visual-check/releases" target="_blank" rel="noopener">Changelog</a>' +
        '<a href="' + REPO + '" target="_blank" rel="noopener">GitHub</a>' +
        '<a class="vc-btn vc-btn--primary" href="#getting-started">Get started</a>' +
      '</nav>';
    var active = sidebarTree.querySelector('[aria-current="page"]');
    if (active) {
      var top = active.offsetTop - sidebarTree.offsetTop;
      if (top < sidebarTree.scrollTop || top > sidebarTree.scrollTop + sidebarTree.clientHeight - 40) {
        sidebarTree.scrollTop = Math.max(0, top - sidebarTree.clientHeight / 3);
      }
    }
  }

  /* ======================================================================
     Article
     ====================================================================== */

  /**
   * Breadcrumb: root folder › separator group. Hidden outside root folders, as Fumadocs does.
   */
  function crumbsHTML(page) {
    if (!page.tab) {
      return '';
    }
    var tab = tabById(page.tab);
    var parts = ['<li><a href="#' + tab.groups[0].pages[0] + '">' + tab.title + '</a></li>'];
    if (page.group) {
      parts.push('<li aria-hidden="true">' + icon('chevRight') + '</li><li>' + page.group + '</li>');
    }
    return '<nav aria-label="Breadcrumb"><ol class="nb-crumbs">' + parts.join('') + '</ol></nav>';
  }

  /**
   * The page actions row: Copy Markdown, Open ▾ and Edit on GitHub.
   */
  function actionsHTML(slug) {
    return '<div class="nb-actions">' +
      '<button class="vc-btn vc-btn--secondary vc-btn--sm" type="button" data-copy-md>' + icon('copy') + '<span>Copy Markdown</span></button>' +
      '<button class="vc-btn vc-btn--secondary vc-btn--sm" type="button" popovertarget="nb-open-menu">Open' + icon('chevDown') + '</button>' +
      '<a class="vc-btn vc-btn--ghost vc-btn--sm nb-actions__edit" href="' + editUrl(slug) + '" target="_blank" rel="noopener">' + icon('pencil') + 'Edit on GitHub</a>' +
    '</div>';
  }

  /**
   * The page's source on GitHub.
   */
  function editUrl(slug) {
    return REPO + '/blob/main/site/content/docs/' + (slug === 'home' ? 'index' : slug) + '.mdx';
  }

  /**
   * The links in the "Open ▾" popover, for the current page.
   */
  function paintOpenMenu(slug) {
    var mdUrl = SITE + (slug === 'home' ? 'index' : slug) + '.md';
    var prompt = encodeURIComponent('Read ' + mdUrl + ', I want to ask questions about it.');
    var items = [
      ['markdown', 'View as Markdown', mdUrl],
      ['chat', 'Open in ChatGPT', 'https://chatgpt.com/?hints=search&q=' + prompt],
      ['chat', 'Open in Claude', 'https://claude.ai/new?q=' + prompt],
      ['cursor', 'Open in Cursor', 'https://cursor.com/link/prompt?text=' + prompt]
    ];
    openMenu.innerHTML = items.map(function (item) {
      return '<a class="nb-menu__item" href="' + item[2] + '" target="_blank" rel="noopener">' + icon(item[0]) + item[1] + '<span class="nb-menu__end">' + icon('external') + '</span></a>';
    }).join('');
  }

  /**
   * Footer: last updated (plus Edit on GitHub when the actions row is hidden), then prev/next.
   */
  function footHTML(slug) {
    var page = PAGES[slug];
    var index = ORDER.indexOf(slug);
    var prev = index > 0 ? ORDER[index - 1] : null;
    var next = index < ORDER.length - 1 ? ORDER[index + 1] : null;
    var meta = '<div class="nb-meta">' +
      '<span>' + (page.updated ? 'Last updated on ' + page.updated : 'Not drafted in this prototype') + '</span>' +
      '<a class="nb-meta__edit" href="' + editUrl(slug) + '" target="_blank" rel="noopener">' + icon('pencil') + 'Edit on GitHub</a>' +
    '</div>';
    var pager = '<nav class="nb-pager" aria-label="Previous and next page">' +
      (prev ? '<a class="nb-pager__prev" href="#' + prev + '"><span class="nb-pager__dir">' + icon('arrowLeft') + 'Previous</span><span class="nb-pager__title">' + md(PAGES[prev].title) + '</span></a>' : '') +
      (next ? '<a class="nb-pager__next" href="#' + next + '"><span class="nb-pager__dir">Next' + icon('arrowRight') + '</span><span class="nb-pager__title">' + md(PAGES[next].title) + '</span></a>' : '') +
    '</nav>';
    return '<footer>' + meta + pager + '</footer>';
  }

  /**
   * The body of a page that isn't drafted: its real title and the bullets the PRD lists for it.
   */
  function stubHTML(page) {
    return '<div class="vc-callout" role="note"><span class="vc-callout__glyph" aria-hidden="true">i</span><div>' +
        '<strong class="vc-callout__title">Not drafted in this prototype</strong>' +
        '<p>This page shows where it sits in the docs. Its content comes from <code>docs/prd/20-docs-site.md</code>, listed below.</p>' +
      '</div></div>' +
      '<h2 id="covers">What this page covers</h2>' +
      '<ul>' + page.bullets.map(function (bullet) {
        return '<li>' + md(bullet) + '</li>';
      }).join('') + '</ul>';
  }

  /**
   * Renders one page into the article.
   */
  function renderPage(slug) {
    var page = PAGES[slug];
    currentSlug = slug;
    document.title = (slug === 'home' ? 'Docs' : plain(page.title)) + ' · visual-check';
    root.classList.toggle('nb-is-full', !!page.full);
    paintHeaderNav(slug);
    paintTabs(page.tab);
    paintNavigation(slug);
    paintOpenMenu(slug);

    var html = '';
    if (!page.full) {
      html += '<div class="nb-head">' + crumbsHTML(page) +
        '<h1 class="nb-title" id="page-title">' + md(page.title) + '</h1>' +
        '<p class="nb-desc">' + md(page.desc) + '</p>' +
        actionsHTML(slug) +
      '</div>';
    }
    html += '<div class="' + (page.full ? 'nb-hubbody' : 'nb-prose') + '" id="nb-prose"></div>';
    html += footHTML(slug);
    article.innerHTML = html;
    article.setAttribute('aria-labelledby', page.full ? 'hub-title' : 'page-title');

    var prose = document.getElementById('nb-prose');
    if (page.template) {
      prose.appendChild(document.getElementById(page.template).content.cloneNode(true));
    } else {
      prose.innerHTML = stubHTML(page);
    }
    enhanceProse(prose, slug);
    buildToc(prose, slug);
    measure();
  }

  /**
   * Inline code, heading anchors, icons in cards, code blocks, the worked example and the hub's generated parts.
   */
  function enhanceProse(prose, slug) {
    prose.querySelectorAll('code').forEach(function (code) {
      if (!code.closest('pre')) {
        code.classList.add('vc-inline-code');
      }
    });
    prose.querySelectorAll('h2[id], h3[id]').forEach(function (heading) {
      if (heading.closest('.nb-hub')) {
        return;
      }
      heading.tabIndex = -1;
      heading.insertAdjacentHTML('beforeend', '<a class="nb-anchor" href="#' + slug + '/' + heading.id + '" aria-label="Link to this section">' + icon('link') + '</a>');
    });
    prose.querySelectorAll('[data-icon]').forEach(function (element) {
      element.innerHTML = icon(element.getAttribute('data-icon'));
      element.setAttribute('aria-hidden', 'true');
    });
    prose.querySelectorAll('.nb-card__title').forEach(function (title) {
      title.insertAdjacentHTML('beforeend', icon('arrowRight'));
    });
    prose.querySelectorAll('[data-pixel-example]').forEach(buildPixelExample);
    var tasks = prose.querySelector('[data-tasks]');
    if (tasks) {
      tasks.innerHTML = TASKS.map(function (task, index) {
        return '<article class="nb-task" aria-labelledby="task-' + index + '">' +
          '<div class="nb-task__head"><span class="nb-chip-icon" aria-hidden="true">' + icon(task.icon) + '</span><h3 class="nb-task__title" id="task-' + index + '">' + task.title + '</h3></div>' +
          '<p class="nb-task__desc">' + md(task.desc) + '</p>' +
          '<ul class="nb-task__links">' + task.pages.map(function (page) {
            return '<li><a href="#' + page + '"><span>' + md(PAGES[page].title) + '</span>' + icon('arrowRight') + '</a></li>';
          }).join('') + '</ul>' +
        '</article>';
      }).join('');
    }
    var browse = prose.querySelector('[data-browse]');
    if (browse) {
      var columns = [];
      TABS.forEach(function (tab) {
        tab.groups.forEach(function (group) {
          columns.push('<div>' +
            '<p class="nb-browse__tab"' + (group.label ? '' : ' aria-hidden="true" style="visibility:hidden"') + '>' + icon(tab.icon) + tab.title + '</p>' +
            '<p class="nb-browse__group">' + (group.label || tab.title) + '</p>' +
            '<ul>' + group.pages.map(function (page) {
              return '<li><a href="#' + page + '">' + md(PAGES[page].title) + '</a></li>';
            }).join('') + '</ul>' +
          '</div>');
        });
      });
      browse.innerHTML = columns.join('');
    }
    paintManagers(prose);
  }

  /* ======================================================================
     TOC with scrollspy (Fumadocs TOC 'normal': a track, and a thumb over every heading in view)
     ====================================================================== */
  var tocTargets = [];
  var tocLinks = [];
  var tocbarLinks = [];

  /**
   * Builds the TOC and the "On this page" panel from the page's h2 and h3 headings.
   */
  function buildToc(prose, slug) {
    tocTargets = Array.prototype.slice.call(prose.querySelectorAll('h2[id], h3[id]')).filter(function (heading) {
      return !heading.closest('.nb-hub');
    });
    var items = tocTargets.map(function (heading) {
      var clone = heading.cloneNode(true);
      clone.querySelectorAll('.nb-anchor').forEach(function (anchor) {
        anchor.remove();
      });
      return '<li><a class="nb-toc__link" data-depth="' + heading.tagName.charAt(1) + '" href="#' + slug + '/' + heading.id + '">' + clone.innerHTML + '</a></li>';
    }).join('');
    if (PAGES[slug].full || !tocTargets.length) {
      tocAside.innerHTML = '';
      tocbarPanel.innerHTML = '';
    } else {
      tocAside.innerHTML =
        '<p class="nb-toc__title">' + icon('list') + 'On this page</p>' +
        '<ul class="nb-toc__list"><span class="nb-toc__thumb" aria-hidden="true"></span>' + items + '</ul>' +
        '<div class="nb-toc__foot">' +
          '<p>Was this page helpful?</p>' +
          '<div class="nb-feedback" data-feedback>' +
            '<button class="vc-btn vc-btn--secondary vc-btn--sm" type="button" data-answer="yes">Yes</button>' +
            '<button class="vc-btn vc-btn--secondary vc-btn--sm" type="button" data-answer="no">No</button>' +
          '</div>' +
        '</div>';
      tocbarPanel.innerHTML = '<nav aria-label="On this page"><ul class="nb-toc__list">' + items + '</ul></nav>';
    }
    tocLinks = Array.prototype.slice.call(tocAside.querySelectorAll('.nb-toc__link'));
    tocbarLinks = Array.prototype.slice.call(tocbarPanel.querySelectorAll('.nb-toc__link'));
    setTocbar(false);
    requestAnimationFrame(updateScrollspy);
  }

  /**
   * Height of the sticky chrome above the content: header plus the "On this page" bar when it shows.
   */
  function stickyOffset() {
    var header = document.getElementById('nd-nav').getBoundingClientRect().height;
    var bar = document.getElementById('nd-toc-popover');
    var barHeight = bar.offsetParent !== null ? bar.getBoundingClientRect().height : 0;
    return header + barHeight;
  }

  /**
   * Marks every TOC item whose section overlaps the viewport, and moves the thumb over them.
   */
  function updateScrollspy() {
    if (!tocTargets.length) {
      tocbarCurrent.textContent = '';
      return;
    }
    var top = stickyOffset();
    var bottom = window.innerHeight;
    var proseEnd = document.getElementById('nb-prose').getBoundingClientRect().bottom;
    var active = [];
    tocTargets.forEach(function (heading, index) {
      var start = heading.getBoundingClientRect().top;
      var end = index < tocTargets.length - 1 ? tocTargets[index + 1].getBoundingClientRect().top : proseEnd;
      /* 32px: a heading reached through its link sits 24px under the sticky chrome, and the section above it
         shouldn't stay marked for that gap. */
      if (end > top + 32 && start < bottom - 8) {
        active.push(index);
      }
    });
    if (!active.length) {
      var passed = -1;
      tocTargets.forEach(function (heading, index) {
        if (heading.getBoundingClientRect().top < top + 8) {
          passed = index;
        }
      });
      active = [Math.max(0, passed)];
    }
    [tocLinks, tocbarLinks].forEach(function (links) {
      links.forEach(function (link, index) {
        var on = active.indexOf(index) >= 0;
        link.classList.toggle('is-active', on);
        if (index === active[0]) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    });
    var thumb = tocAside.querySelector('.nb-toc__thumb');
    if (thumb && tocLinks.length) {
      var first = tocLinks[active[0]];
      var last = tocLinks[active[active.length - 1]];
      thumb.style.top = first.parentElement.offsetTop + 'px';
      thumb.style.height = (last.parentElement.offsetTop + last.parentElement.offsetHeight - first.parentElement.offsetTop) + 'px';
    }
    var label = tocTargets[active[0]].cloneNode(true);
    label.querySelectorAll('.nb-anchor').forEach(function (anchor) {
      anchor.remove();
    });
    tocbarCurrent.textContent = label.textContent.trim();
  }

  var scrollQueued = false;
  window.addEventListener('scroll', function () {
    if (scrollQueued) {
      return;
    }
    scrollQueued = true;
    requestAnimationFrame(function () {
      scrollQueued = false;
      updateScrollspy();
    });
  }, { passive: true });
  window.addEventListener('resize', updateScrollspy);

  /**
   * Opens or closes the "On this page" disclosure.
   */
  function setTocbar(open) {
    tocbarButton.setAttribute('aria-expanded', String(open));
    tocbarPanel.hidden = !open;
  }
  tocbarButton.addEventListener('click', function () {
    setTocbar(tocbarButton.getAttribute('aria-expanded') !== 'true');
  });

  /* ======================================================================
     Routing: #<page> or #<page>/<heading>
     ====================================================================== */

  /**
   * Reads the page and heading from the hash.
   */
  function parseHash() {
    var raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    var parts = raw.split('/');
    var slug = PAGES[parts[0]] ? parts[0] : DEFAULT_PAGE;
    return { slug: slug, anchor: parts[1] || null };
  }

  /**
   * Scrolls to a heading of the current page and moves focus to it.
   */
  function goToHeading(anchor, smooth) {
    var heading = anchor ? document.getElementById(anchor) : null;
    if (!heading || !article.contains(heading)) {
      return;
    }
    heading.scrollIntoView({ behavior: smooth && !reducedMotion.matches ? 'smooth' : 'instant', block: 'start' });
    heading.focus({ preventScroll: true });
  }

  /**
   * Renders the page named in the hash, then scrolls to its heading or to the top.
   */
  function route(event) {
    var target = parseHash();
    var changed = target.slug !== currentSlug;
    if (changed) {
      renderPage(target.slug);
    }
    if (drawer.open) {
      closeDrawer();
    }
    if (target.anchor) {
      goToHeading(target.anchor, !changed);
    } else if (changed) {
      window.scrollTo({ top: 0, behavior: 'instant' });
      if (event) {
        document.getElementById('nb-main').focus({ preventScroll: true });
      }
    } else if (event) {
      window.scrollTo({ top: 0, behavior: reducedMotion.matches ? 'instant' : 'smooth' });
    }
  }
  window.addEventListener('hashchange', route);

  /* Same-page heading links: scroll even when the hash doesn't change. */
  document.addEventListener('click', function (event) {
    var link = event.target.closest('a[href^="#"]');
    if (!link || event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey) {
      return;
    }
    var parts = link.getAttribute('href').slice(1).split('/');
    if (parts[0] === currentSlug && parts[1]) {
      event.preventDefault();
      history.replaceState(null, '', location.pathname + location.search + '#' + parts.join('/'));
      setTocbar(false);
      goToHeading(parts[1], true);
    } else if (parts[0] === currentSlug && !parts[1] && link.closest('.nb-sidebar, .nb-drawer, .nb-tabs')) {
      event.preventDefault();
      if (drawer.open) {
        closeDrawer();
      }
      window.scrollTo({ top: 0, behavior: reducedMotion.matches ? 'auto' : 'smooth' });
    }
  });

  /* ======================================================================
     Interactions: copy, tabs, folders, feedback, popovers, drawer
     ====================================================================== */
  document.addEventListener('click', function (event) {
    var target = event.target;
    var managerButton = target.closest('[data-manager]');
    if (managerButton) {
      setManager(managerButton.getAttribute('data-manager'));
      return;
    }
    var copyCode = target.closest('[data-copy-code]');
    if (copyCode) {
      var figure = copyCode.closest('figure');
      var text;
      if (figure.hasAttribute('data-pm')) {
        text = figure.querySelector('.cmd').textContent;
      } else {
        var clone = figure.querySelector('pre').cloneNode(true);
        clone.querySelectorAll('.p').forEach(function (prompt) {
          prompt.remove();
        });
        text = clone.textContent;
      }
      copyText(text).then(function () {
        flashCopied(copyCode);
      });
      return;
    }
    var copyChip = target.closest('[data-copy-chip]');
    if (copyChip) {
      copyText(pmCommand('dlx', '@visual-check/cli init', manager)).then(function () {
        flashCopied(copyChip);
      });
      return;
    }
    var copyMd = target.closest('[data-copy-md]');
    if (copyMd) {
      copyText(pageMarkdown()).then(function () {
        flashCopied(copyMd);
      });
      return;
    }
    var pixelTab = target.closest('.nb-px__tab');
    if (pixelTab) {
      paintPixelCase(pixelTab.closest('.nb-px'), Number(pixelTab.getAttribute('data-case')));
      return;
    }
    var folder = target.closest('[data-folder]');
    if (folder) {
      var open = folder.getAttribute('aria-expanded') !== 'true';
      openFolders[folder.getAttribute('data-folder')] = open;
      folder.setAttribute('aria-expanded', String(open));
      document.getElementById(folder.getAttribute('aria-controls')).hidden = !open;
      return;
    }
    var answer = target.closest('[data-answer]');
    if (answer) {
      var box = answer.closest('[data-feedback]');
      box.outerHTML = '<p role="status">' + (answer.getAttribute('data-answer') === 'yes' ? 'Thanks for telling us.' : 'Thanks. <a class="vc-link" href="' + REPO + '/issues/new" target="_blank" rel="noopener">Open an issue</a> to say what was missing.') + '</p>';
      return;
    }
    var menuLink = target.closest('.nb-menu a');
    if (menuLink) {
      menuLink.closest('[popover]').hidePopover();
    }
  });

  /**
   * Arrow keys inside a tablist move between tabs and select them. preventDefault keeps the prototype bar's
   * ← / → variant switch from firing.
   */
  document.addEventListener('keydown', function (event) {
    var tab = event.target.closest && event.target.closest('[role="tab"]');
    if (!tab) {
      return;
    }
    var keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
    if (keys.indexOf(event.key) < 0) {
      return;
    }
    event.preventDefault();
    var tabs = Array.prototype.slice.call(tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'));
    var index = tabs.indexOf(tab);
    if (event.key === 'ArrowLeft') {
      index = (index - 1 + tabs.length) % tabs.length;
    } else if (event.key === 'ArrowRight') {
      index = (index + 1) % tabs.length;
    } else if (event.key === 'Home') {
      index = 0;
    } else {
      index = tabs.length - 1;
    }
    tabs[index].click();
    var group = tab.closest('figure, .nb-px');
    var fresh = group ? group.querySelectorAll('[role="tab"]')[index] : tabs[index];
    fresh.focus();
  });

  /* Popovers: place under their trigger, enter with the keyboard, move with ↑ / ↓. */
  var lastPopoverTrigger = null;
  var lastPointer = false;
  document.addEventListener('pointerdown', function () {
    lastPointer = true;
  }, true);
  document.addEventListener('keydown', function () {
    lastPointer = false;
  }, true);
  document.addEventListener('click', function (event) {
    var trigger = event.target.closest('[popovertarget]');
    if (trigger) {
      lastPopoverTrigger = trigger;
    }
  }, true);
  [openMenu, rootMenu].forEach(function (popover) {
    popover.addEventListener('toggle', function (event) {
      var trigger = lastPopoverTrigger;
      if (trigger) {
        trigger.setAttribute('aria-expanded', String(event.newState === 'open'));
      }
      if (event.newState !== 'open' || !trigger) {
        return;
      }
      var rect = trigger.getBoundingClientRect();
      var width = popover.offsetWidth;
      var left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8));
      popover.style.left = left + 'px';
      popover.style.top = (rect.bottom + 6) + 'px';
      if (!lastPointer) {
        var first = popover.querySelector('a');
        if (first) {
          first.focus();
        }
      }
    });
    popover.addEventListener('keydown', function (event) {
      if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].indexOf(event.key) < 0) {
        return;
      }
      event.preventDefault();
      var links = Array.prototype.slice.call(popover.querySelectorAll('a'));
      var index = links.indexOf(document.activeElement);
      if (event.key === 'ArrowDown') {
        links[(index + 1) % links.length].focus();
      } else if (event.key === 'ArrowUp') {
        links[(index - 1 + links.length) % links.length].focus();
      }
    });
  });
  window.addEventListener('scroll', function () {
    [openMenu, rootMenu].forEach(function (popover) {
      if (popover.matches(':popover-open')) {
        popover.hidePopover();
      }
    });
  }, { passive: true });

  /* Drawer (mobile sidebar) */
  var drawerTrigger = document.querySelector('[data-drawer-open]');

  /**
   * Closes the drawer and resets its trigger.
   */
  function closeDrawer() {
    if (drawer.open) {
      drawer.close();
    }
    drawerTrigger.setAttribute('aria-expanded', 'false');
  }
  drawerTrigger.addEventListener('click', function () {
    drawer.showModal();
    drawerTrigger.setAttribute('aria-expanded', 'true');
  });
  ['close', 'cancel'].forEach(function (type) {
    drawer.addEventListener(type, function () {
      drawerTrigger.setAttribute('aria-expanded', 'false');
    });
  });
  drawer.addEventListener('click', function (event) {
    if (event.target === drawer || event.target.closest('[data-drawer-close]')) {
      closeDrawer();
    }
  });
  window.matchMedia('(min-width: 768px)').addEventListener('change', function (query) {
    if (query.matches) {
      closeDrawer();
    }
  });

  /* ======================================================================
     Copy Markdown: the page as Markdown (Fumadocs serves <page>.md; here it is rebuilt from the DOM)
     ====================================================================== */

  /**
   * Inline Markdown for a node: code, links, emphasis.
   */
  function inlineMarkdown(node) {
    var out = '';
    node.childNodes.forEach(function (child) {
      if (child.nodeType === 3) {
        out += child.textContent;
      } else if (child.nodeType === 1) {
        if (child.classList.contains('nb-anchor') || child.tagName === 'svg') {
          return;
        }
        if (child.tagName === 'CODE') {
          out += '`' + child.textContent + '`';
        } else if (child.tagName === 'A') {
          var href = child.getAttribute('href') || '';
          var url = href.charAt(0) === '#' ? SITE + href.slice(1).replace('/', '#') : href;
          out += '[' + inlineMarkdown(child) + '](' + url + ')';
        } else if (child.tagName === 'STRONG' || child.tagName === 'B') {
          out += '**' + inlineMarkdown(child) + '**';
        } else if (child.tagName === 'EM') {
          out += '*' + inlineMarkdown(child) + '*';
        } else {
          out += inlineMarkdown(child);
        }
      }
    });
    return out.replace(/\s+/g, ' ');
  }

  /**
   * Block Markdown for the prose of the current page.
   */
  function blockMarkdown(container, out) {
    Array.prototype.forEach.call(container.children, function (element) {
      var tag = element.tagName;
      if (tag === 'H2' || tag === 'H3') {
        out.push((tag === 'H2' ? '## ' : '### ') + inlineMarkdown(element).trim(), '');
      } else if (tag === 'P') {
        out.push(inlineMarkdown(element).trim(), '');
      } else if (tag === 'UL' || tag === 'OL') {
        Array.prototype.forEach.call(element.children, function (item, index) {
          out.push((tag === 'OL' ? (index + 1) + '. ' : '- ') + inlineMarkdown(item).trim());
        });
        out.push('');
      } else if (tag === 'FIGURE' && element.querySelector('pre')) {
        var title = element.querySelector('.nb-code__title');
        var pre = element.hasAttribute('data-pm') ? element.querySelector('.cmd').textContent : element.querySelector('pre').textContent;
        out.push('```' + (title ? ' title="' + title.textContent.trim() + '"' : ''), pre, '```', '');
      } else if (element.classList.contains('vc-callout')) {
        var calloutTitle = element.querySelector('.vc-callout__title');
        out.push('> **' + (calloutTitle ? calloutTitle.textContent : 'Note') + '**');
        element.querySelectorAll('p').forEach(function (paragraph) {
          out.push('> ' + inlineMarkdown(paragraph).trim());
        });
        out.push('');
      } else if (element.classList.contains('nb-table')) {
        var rows = element.querySelectorAll('tr');
        rows.forEach(function (row, index) {
          out.push('| ' + Array.prototype.map.call(row.children, function (cell) {
            return inlineMarkdown(cell).trim();
          }).join(' | ') + ' |');
          if (index === 0) {
            out.push('|' + Array.prototype.map.call(row.children, function () {
              return ' --- ';
            }).join('|') + '|');
          }
        });
        out.push('');
      } else if (element.classList.contains('nb-typetable')) {
        element.querySelectorAll('.nb-typetable__row').forEach(function (row) {
          out.push('- `' + row.querySelector('.nb-typetable__key').textContent + '`: ' + Array.prototype.map.call(row.querySelectorAll('p'), function (paragraph) {
            return inlineMarkdown(paragraph).trim();
          }).join(' '));
        });
        out.push('');
      } else if (element.classList.contains('nb-px')) {
        out.push('<PixelRow> (interactive in the docs)', '');
      } else if (element.classList.contains('nb-steps') || element.classList.contains('nb-step')) {
        blockMarkdown(element, out);
      } else if (element.textContent.trim()) {
        out.push(element.textContent.replace(/\s+/g, ' ').trim(), '');
      }
    });
  }

  /**
   * The whole current page as Markdown.
   */
  function pageMarkdown() {
    var page = PAGES[currentSlug];
    var out = ['# ' + page.title, '', page.desc, ''];
    blockMarkdown(document.getElementById('nb-prose'), out);
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }

  /* ======================================================================
     Search (⌘K): a static index of titles, descriptions, headings and the planned contents of undrafted pages
     ====================================================================== */
  var INDEX = [];
  Object.keys(PAGES).forEach(function (slug) {
    var page = PAGES[slug];
    var tab = page.tab ? tabById(page.tab).title : 'Docs';
    INDEX.push({ slug: slug, anchor: null, title: page.title, heading: '', text: plain(page.desc) + ' ' + plain((page.bullets || []).join(' ')), tab: tab });
    if (page.template && slug !== 'home') {
      document.getElementById(page.template).content.querySelectorAll('h2[id], h3[id]').forEach(function (heading) {
        var section = [];
        var next = heading.nextElementSibling;
        while (next && !/^H[23]$/.test(next.tagName) && section.join(' ').length < 400) {
          section.push(next.textContent);
          next = next.nextElementSibling;
        }
        INDEX.push({ slug: slug, anchor: heading.id, title: page.title, heading: heading.innerHTML.replace(/<code>([^<]*)<\/code>/g, '`$1`').replace(/<[^>]+>/g, ''), text: section.join(' ').replace(/\s+/g, ' '), tab: tab });
      });
    }
  });
  var SUGGESTED = ['getting-started', 'color-and-pixels', 'wait-hook', 'ci', 'agent-skill'];

  var searchDialog = document.getElementById('nb-search');
  var searchInput = document.getElementById('nb-search-input');
  var searchList = document.getElementById('nb-search-list');
  var searchLabel = document.getElementById('nb-search-label');
  var results = [];
  var activeResult = 0;

  /**
   * Highlights each query word in a title (backticks become code first).
   */
  function highlight(text, words) {
    var html = md(text);
    words.forEach(function (word) {
      if (word.length < 2) {
        return;
      }
      var pattern = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi');
      html = html.replace(pattern, '<mark>$1</mark>');
    });
    return html;
  }

  /**
   * Finds matches: every word must appear; headings and titles weigh more than body text.
   */
  function runSearch(query) {
    var words = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) {
      return SUGGESTED.map(function (slug) {
        return INDEX.filter(function (entry) {
          return entry.slug === slug && !entry.anchor;
        })[0];
      });
    }
    return INDEX.map(function (entry) {
      var title = plain(entry.title).toLowerCase();
      var heading = plain(entry.heading).toLowerCase();
      var haystack = title + ' ' + heading + ' ' + entry.text.toLowerCase();
      var matches = words.every(function (word) {
        return haystack.indexOf(word) >= 0;
      });
      if (!matches) {
        return null;
      }
      var score = entry.anchor ? 0 : 1;
      words.forEach(function (word) {
        if (heading.indexOf(word) >= 0) {
          score += 4;
        }
        if (title.indexOf(word) >= 0) {
          score += entry.anchor ? 1 : 6;
        }
        if (title.indexOf(word) === 0 || heading.indexOf(word) === 0) {
          score += 2;
        }
      });
      return { entry: entry, score: score };
    }).filter(Boolean).sort(function (a, b) {
      return b.score - a.score;
    }).slice(0, 10).map(function (item) {
      return item.entry;
    });
  }

  /**
   * Draws the result list.
   */
  function paintResults() {
    var query = searchInput.value.trim();
    var words = query.toLowerCase().split(/\s+/).filter(Boolean);
    results = runSearch(query);
    activeResult = 0;
    searchLabel.textContent = query ? (results.length ? 'Results' : 'No results') : 'Suggested';
    if (!results.length) {
      searchList.innerHTML = '<li class="nb-search__empty" role="presentation">No page matches “' + escapeHtml(query) + '”. Try a command, a key such as <code>tolerance</code>, or a page name.</li>';
      searchInput.removeAttribute('aria-activedescendant');
      return;
    }
    searchList.innerHTML = results.map(function (entry, index) {
      var title = entry.anchor ? highlight(entry.heading, words) : highlight(entry.title, words);
      var sub = entry.anchor ? entry.tab + ' › ' + md(entry.title) : entry.tab + ' · ' + md(entry.text.split('. ')[0]);
      return '<li class="nb-search__opt" role="option" id="nb-result-' + index + '" data-index="' + index + '" aria-selected="' + String(index === 0) + '">' +
        icon(entry.anchor ? 'hash' : 'page') +
        '<span class="nb-search__body"><span class="nb-search__t">' + title + '</span><span class="nb-search__s">' + sub + '</span></span>' +
      '</li>';
    }).join('');
    searchInput.setAttribute('aria-activedescendant', 'nb-result-0');
  }

  /**
   * Moves the active result.
   */
  function setActiveResult(index) {
    if (!results.length) {
      return;
    }
    activeResult = (index + results.length) % results.length;
    searchList.querySelectorAll('.nb-search__opt').forEach(function (option, optionIndex) {
      option.setAttribute('aria-selected', String(optionIndex === activeResult));
    });
    var active = document.getElementById('nb-result-' + activeResult);
    searchInput.setAttribute('aria-activedescendant', active.id);
    active.scrollIntoView({ block: 'nearest' });
  }

  /**
   * Opens a result and closes the dialog.
   */
  function openResult(index) {
    var entry = results[index];
    if (!entry) {
      return;
    }
    searchDialog.close();
    var hash = '#' + entry.slug + (entry.anchor ? '/' + entry.anchor : '');
    if (location.hash === hash) {
      route();
    } else {
      location.hash = hash;
    }
  }

  /**
   * Opens the search dialog with an empty query.
   */
  function openSearch() {
    if (searchDialog.open) {
      return;
    }
    if (drawer.open) {
      closeDrawer();
    }
    searchInput.value = '';
    paintResults();
    searchDialog.showModal();
    searchInput.focus();
  }

  searchInput.addEventListener('input', paintResults);
  searchInput.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      setActiveResult(activeResult + 1);
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      setActiveResult(activeResult - 1);
    } else if (event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      openResult(activeResult);
    }
  });
  searchList.addEventListener('click', function (event) {
    var option = event.target.closest('.nb-search__opt');
    if (option) {
      openResult(Number(option.getAttribute('data-index')));
    }
  });
  searchList.addEventListener('pointermove', function (event) {
    var option = event.target.closest('.nb-search__opt');
    if (option && Number(option.getAttribute('data-index')) !== activeResult) {
      setActiveResult(Number(option.getAttribute('data-index')));
    }
  });
  searchDialog.addEventListener('click', function (event) {
    if (event.target === searchDialog || event.target.closest('[data-search-close]')) {
      searchDialog.close();
    }
  });
  document.querySelectorAll('[data-search-open]').forEach(function (button) {
    button.addEventListener('click', openSearch);
  });
  document.addEventListener('keydown', function (event) {
    if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      if (searchDialog.open) {
        searchDialog.close();
      } else {
        openSearch();
      }
    }
  });
  var isMac = /Mac|iPhone|iPad/.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '');
  document.querySelectorAll('[data-kbd]').forEach(function (kbd) {
    kbd.textContent = isMac ? '⌘K' : 'Ctrl K';
  });

  /* ======================================================================
     Sticky offsets: the header's real height (64px, or 109px with the tabs row) and the "On this page" bar's
     ====================================================================== */
  /**
   * Publishes the sticky header and TOC bar heights as CSS variables.
   */
  function measure() {
    var header = document.getElementById('nd-nav').getBoundingClientRect().height;
    var bar = document.getElementById('nd-toc-popover');
    root.style.setProperty('--nb-header-h', header + 'px');
    root.style.setProperty('--nb-tocbar-h', (bar.offsetParent !== null ? 44 : 0) + 'px');
  }
  if ('ResizeObserver' in window) {
    new ResizeObserver(measure).observe(document.getElementById('nd-nav'));
  }
  window.addEventListener('resize', measure);
  document.addEventListener('vc-proto:toggle', function () {
    measure();
    requestAnimationFrame(updateScrollspy);
  });

  /* ======================================================================
     Boot
     ====================================================================== */
  measure();
  route();
})();
</script>
</body>
</html>
